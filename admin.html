<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="min-h-screen flex flex-col md:flex-row max-w-7xl mx-auto">
        <!-- Sidebar -->
        <nav class="bg-white w-full md:w-64 p-6 flex flex-col justify-between border-r md:h-screen sticky top-0 z-40">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white">A</div>
                    <span class="font-bold text-xl tracking-tight">Admin Panel</span>
                </div>
                <div class="space-y-1">
                    <button class="w-full text-left p-3 rounded-lg bg-indigo-50 text-indigo-700 font-bold text-sm"><i class="fas fa-chart-pie mr-3"></i>Dashboard</button>
                    <button onclick="document.getElementById('content-area').scrollIntoView()" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 text-slate-500 font-medium text-sm"><i class="fas fa-layer-group mr-3"></i>Content</button>
                </div>
            </div>
            <button onclick="signOutAdmin()" class="mt-4 w-full bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold hover:bg-red-100">Log Out</button>
        </nav>

        <!-- Main Content -->
        <div class="flex-grow p-4 md:p-8 space-y-6">
            
            <!-- Live Class Control -->
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-600"><i class="fas fa-broadcast-tower"></i></div>
                    <div>
                        <h2 class="font-bold text-lg">Live Class Status</h2>
                        <p class="text-xs text-slate-400">Manage your active sessions</p>
                    </div>
                </div>
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <input id="live-url" placeholder="Paste Meet/Zoom Link..." class="bg-slate-50 border-none">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="live-toggle" class="sr-only peer" onchange="toggleLive()">
                        <div class="w-11 h-6 bg-slate-200 rounded-full peer peer-checked:bg-red-500 peer-checked:after:translate-x-full after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                    </label>
                </div>
            </div>

            <!-- Stats -->
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">Total Students</p>
                    <h1 id="stat-users" class="text-3xl font-bold text-slate-800 mt-2">0</h1>
                </div>
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs font-bold text-slate-400 uppercase">Active Materials</p>
                    <h1 id="stat-notes" class="text-3xl font-bold text-indigo-600 mt-2">0</h1>
                </div>
            </div>

            <!-- Student List -->
            <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                    <h3 class="font-bold text-sm text-slate-700">Student Directory</h3>
                    <button onclick="loadUsers()" class="text-xs text-indigo-600 font-bold"><i class="fas fa-sync"></i> Refresh</button>
                </div>
                <div id="user-list" class="max-h-80 overflow-y-auto divide-y divide-slate-100"></div>
            </div>

            <!-- Content Upload -->
            <div id="content-area" class="grid md:grid-cols-2 gap-6">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="font-bold mb-4">Upload Materials</h3>
                    <div class="space-y-3">
                        <select id="note-batch" class="bg-slate-50"><option value="all">All Batches</option><option value="10">Class 10</option><option value="12">Class 12</option></select>
                        <input id="note-title" placeholder="Title..." class="bg-slate-50">
                        <input id="note-file" type="file" class="text-xs">
                        <button id="upload-btn" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700">Upload</button>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="bg-gradient-to-br from-indigo-600 to-purple-700 p-6 rounded-2xl text-white shadow-lg">
                        <h3 class="font-bold text-sm mb-2 opacity-90">ANNOUNCEMENT</h3>
                        <textarea id="announce-text" class="bg-white/10 border-white/20 text-white placeholder-white/50 mb-3" rows="3"></textarea>
                        <button onclick="updateAnnouncement()" class="w-full bg-white text-indigo-700 py-2 rounded-lg font-bold text-xs">Update Banner</button>
                    </div>
                    <button onclick="document.getElementById('exam-modal').classList.remove('hidden')" class="w-full bg-pink-50 text-pink-600 py-4 rounded-2xl font-bold border border-pink-100 border-dashed hover:bg-pink-100">
                        <i class="fas fa-plus-circle mr-2"></i> Create New Exam
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Exam Modal -->
    <div id="exam-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 h-[80vh] flex flex-col">
            <div class="flex justify-between mb-4"><h3 class="font-bold">New Exam</h3><button onclick="document.getElementById('exam-modal').classList.add('hidden')">&times;</button></div>
            <div class="space-y-3 flex-grow overflow-y-auto">
                <input id="pe-title" placeholder="Exam Title">
                <input id="pe-dur" type="number" placeholder="Minutes">
                <select id="pe-batch"><option value="all">All Batches</option><option value="10">Class 10</option><option value="12">Class 12</option></select>
                <input id="pe-file" type="file" class="text-xs">
                <div class="flex gap-2">
                    <input id="pe-count" type="number" placeholder="Question Count">
                    <button onclick="genKeys()" class="bg-slate-800 text-white px-3 rounded-lg text-xs">Set Keys</button>
                </div>
                <div id="pe-keys" class="grid grid-cols-5 gap-2"></div>
            </div>
            <button onclick="pubPDF()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold mt-4">Publish Exam</button>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
    <script>window.signOutAdmin = () => location.href="index.html";</script>
</body>
</html>
