<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800">

    <div class="min-h-screen flex flex-col md:flex-row max-w-7xl mx-auto">
        <!-- Sidebar -->
        <nav class="bg-white w-full md:w-64 p-6 flex flex-col justify-between border-r sticky top-0 md:h-screen z-40">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-white">A</div>
                    <span class="font-bold text-xl">Admin Pro</span>
                </div>
                <div class="space-y-1">
                    <button onclick="showSection('dashboard')" class="w-full text-left p-3 rounded-lg bg-indigo-50 text-indigo-700 font-bold text-sm"><i class="fas fa-chart-pie mr-3"></i>Dashboard</button>
                    <button onclick="showSection('content')" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 text-slate-500 font-medium text-sm"><i class="fas fa-layer-group mr-3"></i>Content</button>
                    <button onclick="showSection('users')" class="w-full text-left p-3 rounded-lg hover:bg-slate-50 text-slate-500 font-medium text-sm"><i class="fas fa-users mr-3"></i>Students</button>
                </div>
            </div>
            <button onclick="signOutAdmin()" class="mt-4 w-full bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold hover:bg-red-100">Log Out</button>
        </nav>

        <!-- Main Content -->
        <div class="flex-grow p-4 md:p-8 space-y-6 overflow-y-auto">
            
            <!-- SECTION: Dashboard -->
            <div id="sec-dashboard" class="space-y-6">
                <!-- Live Class -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-full bg-red-100 flex items-center justify-center text-red-600 animate-pulse"><i class="fas fa-broadcast-tower"></i></div>
                        <div>
                            <h2 class="font-bold text-lg">Live Class</h2>
                            <input id="live-topic" placeholder="Topic..." class="text-xs border-b border-0 p-1 w-full focus:ring-0">
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <input id="live-url" placeholder="Meet Link" class="p-2 border rounded text-xs">
                        <input type="checkbox" id="live-toggle" onchange="toggleLive()" class="toggle-checkbox">
                    </div>
                </div>

                <!-- Stats -->
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200"><p class="text-xs font-bold text-slate-400">USERS</p><h1 id="stat-users" class="text-3xl font-bold">0</h1></div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-200"><p class="text-xs font-bold text-slate-400">NOTES</p><h1 id="stat-notes" class="text-3xl font-bold text-indigo-600">0</h1></div>
                </div>
                
                <!-- Announcement -->
                <div class="bg-indigo-600 p-6 rounded-2xl text-white">
                    <h3 class="font-bold text-sm mb-2">BANNER MESSAGE</h3>
                    <textarea id="announce-text" class="w-full bg-white/10 border-white/20 rounded p-2 text-white text-sm mb-2" rows="2"></textarea>
                    <button onclick="updateAnnouncement()" class="bg-white text-indigo-700 px-4 py-2 rounded font-bold text-xs">Update</button>
                </div>
            </div>

            <!-- SECTION: Content -->
            <div id="sec-content" class="hidden grid md:grid-cols-2 gap-6">
                <!-- Upload Notes -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200">
                    <h3 class="font-bold mb-4 flex gap-2"><i class="fas fa-file-pdf text-red-500"></i> Upload PDF/Note</h3>
                    <div class="space-y-3">
                        <select id="note-batch" class="w-full p-2 border rounded text-sm"><option value="all">All Batches</option><option value="10">Class 10</option><option value="12">Class 12</option></select>
                        <input id="note-title" placeholder="Title" class="w-full p-2 border rounded text-sm">
                        <input id="note-file" type="file" class="text-xs">
                        <button id="upload-note-btn" class="w-full bg-indigo-600 text-white py-2 rounded font-bold">Upload</button>
                    </div>
                </div>

                <!-- Upload Video -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200">
                    <h3 class="font-bold mb-4 flex gap-2"><i class="fab fa-youtube text-red-600"></i> Embed Video</h3>
                    <div class="space-y-3">
                        <select id="vid-batch" class="w-full p-2 border rounded text-sm"><option value="all">All Batches</option><option value="10">Class 10</option></select>
                        <input id="vid-title" placeholder="Video Title" class="w-full p-2 border rounded text-sm">
                        <input id="vid-url" placeholder="YouTube Link (e.g. youtu.be/xyz)" class="w-full p-2 border rounded text-sm">
                        <button onclick="uploadVideo()" class="w-full bg-red-600 text-white py-2 rounded font-bold">Add Video</button>
                    </div>
                </div>
                
                <!-- Create Flashcard -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200">
                    <h3 class="font-bold mb-4 flex gap-2"><i class="fas fa-layer-group text-green-500"></i> Add Flashcard</h3>
                    <input id="fc-front" placeholder="Question" class="w-full p-2 border rounded text-sm mb-2">
                    <input id="fc-back" placeholder="Answer" class="w-full p-2 border rounded text-sm mb-2">
                    <button onclick="addFlashcard()" class="w-full bg-green-600 text-white py-2 rounded font-bold">Create Card</button>
                </div>

                <!-- Post Homework -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200">
                    <h3 class="font-bold mb-4 flex gap-2"><i class="fas fa-tasks text-orange-500"></i> Post Homework</h3>
                    <input id="hw-title" placeholder="Assignment Title" class="w-full p-2 border rounded text-sm mb-2">
                    <input id="hw-date" type="date" class="w-full p-2 border rounded text-sm mb-2">
                    <button onclick="postHW()" class="w-full bg-orange-500 text-white py-2 rounded font-bold">Assign</button>
                </div>

                <button onclick="document.getElementById('exam-modal').classList.remove('hidden')" class="w-full col-span-2 bg-pink-50 text-pink-600 py-4 rounded-xl font-bold border-2 border-pink-100 border-dashed hover:bg-pink-100">
                    <i class="fas fa-plus-circle mr-2"></i> Create PDF Exam
                </button>
            </div>

            <!-- SECTION: Users -->
            <div id="sec-users" class="hidden bg-white rounded-2xl border border-slate-200 overflow-hidden">
                <div class="p-4 border-b bg-slate-50 flex justify-between">
                    <h3 class="font-bold text-sm">Student List</h3>
                    <button onclick="loadUsers()" class="text-xs font-bold text-indigo-600">Refresh</button>
                </div>
                <div id="user-list" class="max-h-96 overflow-y-auto divide-y divide-slate-100"></div>
            </div>
        </div>
    </div>

    <!-- Exam Modal (Same as before) -->
    <div id="exam-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 h-[80vh] flex flex-col">
            <div class="flex justify-between mb-4"><h3 class="font-bold">New Exam</h3><button onclick="document.getElementById('exam-modal').classList.add('hidden')">&times;</button></div>
            <div class="space-y-3 flex-grow overflow-y-auto">
                <input id="pe-title" placeholder="Title" class="w-full border p-2 rounded">
                <div class="flex gap-2">
                    <input id="pe-dur" type="number" placeholder="Mins" class="w-1/2 border p-2 rounded">
                    <select id="pe-batch" class="w-1/2 border p-2 rounded"><option value="all">All</option><option value="10">Class 10</option></select>
                </div>
                <input id="pe-file" type="file" class="text-xs w-full">
                <div class="flex gap-2"><input id="pe-count" type="number" placeholder="# Qs" class="w-full border p-2 rounded"><button onclick="genKeys()" class="bg-slate-800 text-white px-3 rounded text-xs">Keys</button></div>
                <div id="pe-keys" class="grid grid-cols-4 gap-2"></div>
            </div>
            <button onclick="pubPDF()" class="w-full bg-indigo-600 text-white py-3 rounded font-bold mt-2">Publish</button>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
    <script>
        function showSection(id) {
            ['dashboard','content','users'].forEach(s => document.getElementById('sec-'+s).classList.add('hidden'));
            document.getElementById('sec-'+id).classList.remove('hidden');
        }
    </script>
</body>
</html>
