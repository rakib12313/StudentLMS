<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #6366f1; --surface: rgba(255, 255, 255, 0.9); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; overflow-x: hidden; }
        
        .mesh-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%); background-size: 200% 200%; animation: gradient 15s ease infinite; }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .glass { background: var(--surface); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .sidebar-link { display: flex; gap: 12px; padding: 12px; border-radius: 12px; color: #64748b; font-weight: 600; cursor: pointer; transition: 0.2s; align-items: center; }
        .sidebar-link.active, .sidebar-link:hover { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99,102,241,0.3); }
        
        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.1); }
        mjx-container { margin: 0 !important; }
    </style>
</head>
<body class="text-slate-800">
    <div class="mesh-bg"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass m-4 hidden md:flex flex-col justify-between p-6">
            <div>
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg">N</div>
                    <span class="font-bold text-xl text-white">Admin</span>
                </div>
                <nav class="space-y-1">
                    <div onclick="nav('dashboard')" id="nav-dashboard" class="sidebar-link active"><i class="fas fa-chart-pie w-5"></i> Dashboard</div>
                    <div onclick="nav('exams')" id="nav-exams" class="sidebar-link"><i class="fas fa-edit w-5"></i> Exams</div>
                    <div onclick="nav('live')" id="nav-live" class="sidebar-link"><i class="fas fa-broadcast-tower w-5"></i> Live Class</div>
                    <div onclick="nav('students')" id="nav-students" class="sidebar-link"><i class="fas fa-users w-5"></i> Students</div>
                    <div onclick="nav('results')" id="nav-results" class="sidebar-link"><i class="fas fa-trophy w-5"></i> Results</div>
                </nav>
            </div>
            <button onclick="signOutAdmin()" class="w-full py-3 bg-red-50 text-red-500 rounded-xl font-bold hover:bg-red-100">Log Out</button>
        </aside>

        <!-- Main -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="md:hidden flex justify-between items-center mb-6 glass p-4">
                <span class="font-bold text-lg text-indigo-700">Nebula Admin</span>
                <button onclick="signOutAdmin()" class="text-red-500"><i class="fas fa-power-off"></i></button>
            </div>

            <!-- VIEW: Dashboard -->
            <div id="view-dashboard" class="space-y-6 fade-in">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="glass p-6 text-center"><div class="text-xs font-bold text-slate-400 uppercase">Total Students</div><h2 class="text-4xl font-bold text-slate-800" id="stat-users">0</h2></div>
                    <div class="glass p-6 text-center"><div class="text-xs font-bold text-slate-400 uppercase">Exams Published</div><h2 class="text-4xl font-bold text-indigo-600" id="stat-exams">0</h2></div>
                    <div class="glass p-6 text-center"><div class="text-xs font-bold text-slate-400 uppercase">Total Attempts</div><h2 class="text-4xl font-bold text-green-600" id="stat-attempts">0</h2></div>
                </div>
                <div class="glass p-6">
                    <h3 class="font-bold mb-4">Quick Actions</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="openExamModal()" class="p-4 border rounded-xl hover:bg-indigo-50 text-center"><i class="fas fa-plus text-2xl text-indigo-600 mb-2"></i><div class="font-bold text-xs">Create Exam</div></button>
                        <button onclick="nav('results')" class="p-4 border rounded-xl hover:bg-indigo-50 text-center"><i class="fas fa-download text-2xl text-indigo-600 mb-2"></i><div class="font-bold text-xs">Export Data</div></button>
                    </div>
                </div>
            </div>

            <!-- VIEW: Live Class -->
            <div id="view-live" class="hidden space-y-6 fade-in">
                <div class="glass p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-bold">Live Session Control</h2>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="live-toggle" class="sr-only peer" onchange="toggleLive()">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
                        </label>
                    </div>
                    <div class="space-y-3">
                        <div><label class="text-xs font-bold uppercase text-slate-400">Topic</label><input id="live-topic" placeholder="e.g. Physics Ch-3"></div>
                        <div><label class="text-xs font-bold uppercase text-slate-400">Meeting URL</label><input id="live-url" placeholder="Zoom/Meet Link"></div>
                    </div>
                </div>
                <div class="glass p-6 bg-indigo-600 text-white">
                    <h3 class="font-bold text-sm mb-2">Announcement Banner</h3>
                    <textarea id="announce-text" class="w-full bg-white/10 border-white/20 rounded p-2 text-white mb-2" rows="2"></textarea>
                    <button onclick="updateAnnouncement()" class="bg-white text-indigo-700 px-4 py-2 rounded font-bold text-xs">Update Banner</button>
                </div>
            </div>

            <!-- VIEW: Exams -->
            <div id="view-exams" class="hidden space-y-6 fade-in">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-white">Exams</h2>
                    <button onclick="openExamModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-lg">+ New</button>
                </div>
                <div id="exam-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- VIEW: Students -->
            <div id="view-students" class="hidden space-y-6 fade-in">
                <div class="glass p-4"><input id="search-st" onkeyup="filterUsers()" placeholder="Search students..."></div>
                <div class="glass overflow-hidden"><div id="user-list" class="divide-y divide-slate-100"></div></div>
            </div>

            <!-- VIEW: Results -->
            <div id="view-results" class="hidden space-y-6 fade-in">
                <div class="flex justify-between"><h2 class="text-2xl font-bold text-white">Results</h2><button onclick="exportCSV()" class="px-4 py-2 bg-green-600 text-white rounded-lg font-bold">CSV</button></div>
                <div class="glass overflow-hidden"><table class="w-full text-sm text-left"><thead class="bg-indigo-50 text-indigo-900"><tr><th class="p-4">Name</th><th class="p-4">Exam</th><th class="p-4">Score</th><th class="p-4">Date</th></tr></thead><tbody id="results-table" class="divide-y"></tbody></table></div>
            </div>
        </main>
    </div>

    <!-- EXAM MODAL -->
    <div id="exam-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-5xl rounded-2xl h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-indigo-50">
                <h3 class="font-bold text-lg text-indigo-900">Create Exam</h3>
                <button onclick="document.getElementById('exam-modal').classList.add('hidden')" class="text-2xl text-slate-400 hover:text-red-500">&times;</button>
            </div>
            <div class="flex-grow overflow-y-auto p-6 space-y-6 bg-slate-50">
                <div class="bg-white p-6 rounded-2xl border shadow-sm grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="col-span-2"><label class="text-xs font-bold text-slate-400 uppercase">Title</label><input id="ex-title" class="font-bold"></div>
                    <div><label class="text-xs font-bold text-slate-400 uppercase">Subject</label><select id="ex-sub"><option>Physics</option><option>Chemistry</option><option>Maths</option><option>Biology</option></select></div>
                    <div><label class="text-xs font-bold text-slate-400 uppercase">Time (Min)</label><input id="ex-dur" type="number"></div>
                    <div><label class="text-xs font-bold text-green-600 uppercase">Correct</label><input id="ex-pos" type="number" value="4"></div>
                    <div><label class="text-xs font-bold text-red-500 uppercase">Wrong</label><input id="ex-neg" type="number" value="1"></div>
                    <div class="col-span-2 flex items-center gap-3"><input type="checkbox" id="ex-random" checked class="w-5 h-5"><span class="text-sm font-bold text-indigo-700">Randomize Questions</span></div>
                </div>
                
                <!-- Modes -->
                <div class="flex gap-4 border-b">
                    <button onclick="setMode('manual')" id="tab-manual" class="pb-2 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600">Manual</button>
                    <button onclick="setMode('pdf')" id="tab-pdf" class="pb-2 text-sm font-bold text-slate-400">PDF Upload</button>
                </div>

                <!-- Manual Mode -->
                <div id="mode-manual" class="space-y-4">
                    <div id="q-container" class="space-y-4"></div>
                    <button onclick="addQuestion()" class="w-full py-4 border-2 border-dashed border-indigo-300 text-indigo-600 font-bold rounded-xl hover:bg-indigo-50">+ Add Question</button>
                    <div class="bg-white p-4 rounded-xl border mt-4"><p class="text-xs font-bold text-slate-400 uppercase mb-2">Or Paste JSON</p><textarea id="json-input" class="text-xs font-mono h-20" placeholder='[{"q":"...","options":["..."],"correct":0}]'></textarea><button onclick="parseJSON()" class="mt-2 text-xs bg-slate-800 text-white px-3 py-1 rounded">Import JSON</button></div>
                </div>

                <!-- PDF Mode -->
                <div id="mode-pdf" class="hidden space-y-4">
                    <input id="ex-file" type="file" class="w-full border p-2 rounded bg-white">
                    <div class="flex gap-2"><input id="ex-count" type="number" placeholder="Total Qs" class="border p-2 rounded"><button onclick="genKeys()" class="bg-indigo-600 text-white px-4 rounded text-xs">Generate OMR</button></div>
                    <div id="ex-keys" class="grid grid-cols-5 gap-2 max-h-40 overflow-y-auto"></div>
                </div>
            </div>
            <div class="p-4 border-t bg-white flex justify-end"><button onclick="publishExam()" class="px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg">Publish</button></div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, getDocs, setDoc, addDoc, deleteDoc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allStudents=[], bulkData=[];

        onAuthStateChanged(auth, async (user) => {
            if(!user || (await getDoc(doc(db, "students", user.uid))).data().role !== "admin") location.href="index.html";
            initAdmin();
        });

        async function initAdmin() {
            const u = await getDocs(collection(db, "students"));
            const e = await getDocs(collection(db, "exams"));
            const r = await getDocs(collection(db, "results"));
            document.getElementById('stat-users').innerText = u.size;
            document.getElementById('stat-exams').innerText = e.size;
            document.getElementById('stat-attempts').innerText = r.size;
            loadExams(); loadStudents(); loadResults();
        }

        window.nav = (tab) => {
            ['dashboard','exams','live','students','results'].forEach(t => { document.getElementById('view-'+t).classList.add('hidden'); document.getElementById('nav-'+t)?.classList.remove('active'); });
            document.getElementById('view-'+tab).classList.remove('hidden'); document.getElementById('nav-'+tab)?.classList.add('active');
        };

        window.setMode = (m) => {
            ['manual','pdf'].forEach(x => { document.getElementById('mode-'+x).classList.toggle('hidden', x!==m); document.getElementById('tab-'+x).className = x===m ? "pb-2 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600" : "pb-2 text-sm font-bold text-slate-400"; });
            window.examMode = m;
        }; window.examMode = 'manual';

        // Students
        async function loadStudents() { const s = await getDocs(collection(db, "students")); allStudents=[]; s.forEach(d=>allStudents.push({id:d.id, ...d.data()})); renderStudents(allStudents); }
        function renderStudents(list) { document.getElementById('user-list').innerHTML = list.map(s => `<div class="p-4 flex justify-between items-center hover:bg-slate-50"><div class="flex items-center gap-3"><div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold">${s.name?s.name[0]:'U'}</div><div><div class="font-bold text-sm">${s.name||'User'}</div><div class="text-xs text-slate-500">${s.email}</div></div></div><div class="flex gap-2"><button onclick="banUser('${s.id}', ${!s.banned})" class="text-xs px-3 py-1 rounded font-bold ${s.banned?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${s.banned?'Unban':'Ban'}</button>${s.deviceId ? `<button onclick="resetDevice('${s.id}')" class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded font-bold">Unlock</button>`:''}</div></div>`).join(''); }
        window.filterUsers = () => { const q=document.getElementById('search-st').value.toLowerCase(); renderStudents(allStudents.filter(s=>s.name?.toLowerCase().includes(q)||s.email.toLowerCase().includes(q))); };
        window.banUser = async(id, st) => { await updateDoc(doc(db,"students",id),{banned:st}); loadStudents(); };
        window.resetDevice = async(id) => { await updateDoc(doc(db,"students",id),{deviceId:null}); loadStudents(); };

        // Exams
        window.addQuestion = () => {
            const id = Date.now();
            const h = `<div class="bg-white p-4 rounded-xl border relative q-item" id="q-${id}"><button onclick="document.getElementById('q-${id}').remove()" class="absolute top-2 right-2 text-red-500"><i class="fas fa-trash"></i></button><textarea class="w-full mb-2 q-txt border rounded p-2 text-sm font-bold" placeholder="Question (Use \\( .. \\) for Math)"></textarea><input class="q-img mb-2 text-xs border rounded p-2" placeholder="Image URL"><div class="grid grid-cols-2 gap-2 mb-2">${[0,1,2,3].map(i=>`<input class="q-opt-${i} border rounded p-2 text-xs" placeholder="Option ${String.fromCharCode(65+i)}">`).join('')}</div><div class="flex gap-2"><select class="q-ans border rounded p-2 text-xs font-bold"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><input class="q-sol border rounded p-2 text-xs flex-grow" placeholder="Solution"></div></div>`;
            document.getElementById('q-container').insertAdjacentHTML('beforeend', h);
        };
        window.parseJSON = () => { try { bulkData=JSON.parse(document.getElementById('json-input').value); alert("JSON Parsed!"); } catch(e){alert("Invalid JSON");} };
        window.genKeys = () => { const c=document.getElementById('ex-count').value; let h=''; for(let i=0;i<c;i++) h+=`<select class="pk border p-1 text-[10px]"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>`; document.getElementById('ex-keys').innerHTML=h; };

        window.publishExam = async () => {
            const title = document.getElementById('ex-title').value;
            const dur = document.getElementById('ex-dur').value;
            if(!title || !dur) return alert("Fill Title/Duration");

            const data = { title, subject:document.getElementById('ex-sub').value, duration:parseInt(dur), posMarks:parseInt(document.getElementById('ex-pos').value), negMarks:parseInt(document.getElementById('ex-neg').value), randomize:document.getElementById('ex-random').checked, createdAt:serverTimestamp() };

            if(window.examMode === 'pdf') {
                const file = document.getElementById('ex-file').files[0];
                if(!file) return alert("Upload PDF");
                const f = new FormData(); f.append('file', file); f.append('upload_preset', 'lms_upload'); // YOUR PRESET
                const r = await fetch('https://api.cloudinary.com/v1_1/dpe74ejhl/upload', {method:'POST', body:f}); // YOUR CLOUD NAME
                const d = await r.json();
                data.type = 'pdf_exam'; data.fileUrl = d.secure_url;
                data.answerKey = []; document.querySelectorAll('.pk').forEach(s => data.answerKey.push(parseInt(s.value)));
            } else {
                data.type = 'native_exam'; data.questions = [];
                if(bulkData.length>0) data.questions = bulkData;
                else {
                    document.querySelectorAll('.q-item').forEach(q => {
                        const txt = q.querySelector('.q-txt').value;
                        const img = q.querySelector('.q-img').value;
                        const opts = [0,1,2,3].map(i => q.querySelector(`.q-opt-${i}`).value);
                        const ans = parseInt(q.querySelector('.q-ans').value);
                        const sol = q.querySelector('.q-sol').value;
                        if(txt) data.questions.push({q:txt, img, options:opts, correct:ans, sol});
                    });
                }
            }
            await addDoc(collection(db,"exams"), data); alert("Published!"); location.reload();
        };

        async function loadExams() { const s = await getDocs(query(collection(db, "exams"), orderBy("createdAt","desc"))); document.getElementById('exam-list').innerHTML = s.docs.map(d => `<div class="glass p-4 flex justify-between items-center"><div><div class="font-bold text-indigo-900">${d.data().title}</div><div class="text-xs text-slate-500">${d.data().subject} • ${d.data().type==='pdf_exam'?'PDF':'CBT'}</div></div><button onclick="delExam('${d.id}')" class="text-red-500"><i class="fas fa-trash"></i></button></div>`).join(''); }
        window.delExam = async(id) => { if(confirm("Delete?")) await deleteDoc(doc(db,"exams",id)); loadExams(); };

        // Live & Results
        window.toggleLive = async () => { const active = document.getElementById('live-toggle').checked; await setDoc(doc(db,"settings","live"), { active, topic:document.getElementById('live-topic').value, url:document.getElementById('live-url').value }); };
        window.updateAnnouncement = async () => setDoc(doc(db,"settings","announcement"), { text: document.getElementById('announce-text').value });
        
        async function loadResults() {
            const s = await getDocs(query(collection(db,"results"), orderBy("timestamp","desc")));
            let csv = "Name,Exam,Score,Date\n";
            let html = "";
            s.forEach(d => {
                const r = d.data();
                const dt = r.timestamp ? new Date(r.timestamp.seconds*1000).toLocaleDateString() : '-';
                csv += `${r.studentName},${r.examTitle},${r.score},${dt}\n`;
                html += `<tr class="hover:bg-slate-50"><td class="p-3 font-bold">${r.studentName}</td><td class="p-3">${r.examTitle}</td><td class="p-3 font-bold text-indigo-600">${r.score}</td><td class="p-3 text-xs text-slate-400">${dt}</td></tr>`;
            });
            document.getElementById('results-table').innerHTML = html;
            window.csvUri = encodeURI("data:text/csv;charset=utf-8,"+csv);
        }
        window.exportCSV = () => window.open(window.csvUri);
        window.openExamModal = () => document.getElementById('exam-modal').classList.remove('hidden');
        window.signOutAdmin = () => signOut(auth).then(()=>location.href="index.html");
        window.addQuestion = window.addQuestion; // Expose
    </script>
</body>
</html>
