<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; }
        .glass { background: rgba(255,255,255,0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; color: #64748b; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .sidebar-link.active, .sidebar-link:hover { background: #6366f1; color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        .hidden { display: none !important; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; }
        input:focus { border-color: #6366f1; ring: 2px; }
        mjx-container { margin: 0 !important; }
    </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 glass m-4 hidden md:flex flex-col justify-between p-6">
        <div>
            <div class="flex items-center gap-3 mb-8">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg">N</div>
                <span class="font-bold text-xl">Admin Pro</span>
            </div>
            <nav class="space-y-1">
                <div onclick="nav('dashboard')" id="nav-dashboard" class="sidebar-link active"><i class="fas fa-chart-pie w-5"></i> Dashboard</div>
                <div onclick="nav('exams')" id="nav-exams" class="sidebar-link"><i class="fas fa-edit w-5"></i> Exam Manager</div>
                <div onclick="nav('content')" id="nav-content" class="sidebar-link"><i class="fas fa-layer-group w-5"></i> Content Studio</div>
                <div onclick="nav('users')" id="nav-users" class="sidebar-link"><i class="fas fa-users w-5"></i> Students</div>
            </nav>
        </div>
        <button onclick="signOutAdmin()" class="w-full py-3 bg-red-50 text-red-500 rounded-xl font-bold hover:bg-red-100">Log Out</button>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8">
        <!-- Dashboard -->
        <div id="view-dashboard" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="glass p-6 text-center"><div class="text-xs font-bold text-slate-400 uppercase">Users</div><h2 class="text-4xl font-bold text-slate-800" id="stat-users">0</h2></div>
                <div class="glass p-6 text-center"><div class="text-xs font-bold text-slate-400 uppercase">Exams</div><h2 class="text-4xl font-bold text-indigo-600" id="stat-exams">0</h2></div>
                <div class="glass p-6 text-center"><div class="text-xs font-bold text-slate-400 uppercase">Notes</div><h2 class="text-4xl font-bold text-green-600" id="stat-notes">0</h2></div>
            </div>
            
            <!-- Live Control -->
            <div class="glass p-6 flex flex-col md:flex-row justify-between items-center gap-4 bg-indigo-600 text-white">
                <div><h3 class="font-bold">Live Class & Announcements</h3><p class="text-xs opacity-70">Manage real-time updates</p></div>
                <div class="flex gap-2 w-full md:w-auto">
                    <input id="live-url" placeholder="Meeting Link" class="text-slate-800 text-sm">
                    <button onclick="toggleLive()" class="bg-white text-indigo-600 px-4 rounded-lg font-bold text-xs">Go Live</button>
                </div>
            </div>
        </div>

        <!-- Exam Manager -->
        <div id="view-exams" class="hidden space-y-6">
            <div class="flex justify-between items-center"><h2 class="text-2xl font-bold">Exams</h2><button onclick="openModal('exam')" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-lg">+ Create</button></div>
            <div id="exam-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <!-- Content Studio -->
        <div id="view-content" class="hidden space-y-6">
            <h2 class="text-2xl font-bold">Content Studio</h2>
            <div class="grid md:grid-cols-3 gap-6">
                <div class="glass p-6">
                    <h3 class="font-bold mb-4 text-indigo-600"><i class="fas fa-file-pdf"></i> Upload Note</h3>
                    <input id="note-title" placeholder="Title" class="mb-2 text-sm"><input id="note-file" type="file" class="mb-2 text-xs">
                    <button onclick="uploadContent('note')" class="w-full bg-slate-800 text-white py-2 rounded text-xs font-bold">Upload</button>
                </div>
                <div class="glass p-6">
                    <h3 class="font-bold mb-4 text-red-600"><i class="fab fa-youtube"></i> Add Video</h3>
                    <input id="vid-title" placeholder="Title" class="mb-2 text-sm"><input id="vid-url" placeholder="YouTube Link" class="mb-2 text-sm">
                    <button onclick="uploadContent('video')" class="w-full bg-slate-800 text-white py-2 rounded text-xs font-bold">Add</button>
                </div>
                <div class="glass p-6">
                    <h3 class="font-bold mb-4 text-green-600"><i class="fas fa-layer-group"></i> Flashcard</h3>
                    <input id="fc-front" placeholder="Question" class="mb-2 text-sm"><input id="fc-back" placeholder="Answer" class="mb-2 text-sm">
                    <button onclick="uploadContent('flashcard')" class="w-full bg-slate-800 text-white py-2 rounded text-xs font-bold">Create</button>
                </div>
            </div>
        </div>

        <!-- Users -->
        <div id="view-users" class="hidden space-y-6">
            <div class="glass p-4"><input id="search-st" onkeyup="filterUsers()" placeholder="Search students..."></div>
            <div id="user-list" class="glass overflow-hidden divide-y divide-slate-100"></div>
        </div>
    </main>

    <!-- EXAM CREATOR MODAL -->
    <div id="exam-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-5xl rounded-2xl h-[90vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center"><h3 class="font-bold text-lg">Create Exam</h3><button onclick="closeModal()" class="text-2xl">&times;</button></div>
            <div class="flex-grow overflow-y-auto p-6 space-y-6 bg-slate-50">
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-white p-4 rounded-xl border">
                    <div class="col-span-2"><label class="text-[10px] font-bold uppercase text-slate-400">Title</label><input id="ex-title" class="font-bold"></div>
                    <div><label class="text-[10px] font-bold uppercase text-slate-400">Class</label><select id="ex-batch"><option value="all">All</option><option value="10">10</option><option value="12">12</option></select></div>
                    <div><label class="text-[10px] font-bold uppercase text-slate-400">Subject</label><select id="ex-sub"><option>Physics</option><option>Math</option><option>Chemistry</option></select></div>
                    <div><label class="text-[10px] font-bold uppercase text-slate-400">Duration</label><input id="ex-dur" type="number"></div>
                    <div><label class="text-[10px] font-bold uppercase text-green-600">Pos (+)</label><input id="ex-pos" type="number" value="4"></div>
                    <div><label class="text-[10px] font-bold uppercase text-red-500">Neg (-)</label><input id="ex-neg" type="number" value="1"></div>
                    <div class="col-span-2 flex items-center gap-2 border p-2 rounded"><input type="checkbox" id="ex-random" checked><span class="text-xs font-bold text-indigo-700">Randomize</span></div>
                </div>
                <!-- Manual Builder -->
                <div id="q-container" class="space-y-4"></div>
                <button onclick="addQuestion()" class="w-full py-3 border-2 border-dashed border-indigo-300 text-indigo-600 font-bold rounded-xl hover:bg-indigo-50">+ Add Question</button>
            </div>
            <div class="p-4 border-t flex justify-end"><button onclick="publishExam()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg font-bold">Publish</button></div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, getDocs, setDoc, addDoc, deleteDoc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onAuthStateChanged(auth, async(u) => { if(!u || (await getDoc(doc(db,"students",u.uid))).data().role!=='admin') location.href="index.html"; init(); });

        async function init() {
            const u = await getDocs(collection(db,"students"));
            const e = await getDocs(collection(db,"exams"));
            const n = await getDocs(collection(db,"notes"));
            document.getElementById('stat-users').innerText = u.size;
            document.getElementById('stat-exams').innerText = e.size;
            document.getElementById('stat-notes').innerText = n.size;
            loadExams(); loadUsers();
        }

        window.nav = (t) => { ['dashboard','exams','content','users'].forEach(x=>{document.getElementById('view-'+x).classList.add('hidden'); document.getElementById('nav-'+x).classList.remove('active');}); document.getElementById('view-'+t).classList.remove('hidden'); document.getElementById('nav-'+t).classList.add('active'); };
        
        // --- Content & Users ---
        window.uploadContent = async(type) => {
            const batch = "all"; // Default
            if(type==='note') {
                const f = document.getElementById('note-file').files[0];
                const fm = new FormData(); fm.append('file',f); fm.append('upload_preset','lms_upload');
                const r = await fetch('https://api.cloudinary.com/v1_1/dpe74ejhl/upload', {method:'POST',body:fm});
                const d = await r.json();
                await addDoc(collection(db,"notes"),{title:document.getElementById('note-title').value, url:d.secure_url, batch, createdAt:serverTimestamp()});
            } else if(type==='video') {
                await addDoc(collection(db,"videos"),{title:document.getElementById('vid-title').value, url:document.getElementById('vid-url').value, batch, createdAt:serverTimestamp()});
            } else {
                await addDoc(collection(db,"flashcards"),{front:document.getElementById('fc-front').value, back:document.getElementById('fc-back').value, batch, createdAt:serverTimestamp()});
            }
            alert(type+" Added!");
        };

        window.loadUsers = async() => { const s=await getDocs(collection(db,"students")); document.getElementById('user-list').innerHTML = s.docs.map(d=>`<div class="p-4 flex justify-between items-center"><span class="font-bold">${d.data().name}</span> <button onclick="banUser('${d.id}',${!d.data().banned})" class="text-xs px-2 py-1 rounded ${d.data().banned?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${d.data().banned?'Unban':'Ban'}</button></div>`).join(''); };
        window.banUser = async(id, s) => { await updateDoc(doc(db,"students",id),{banned:s}); loadUsers(); };

        // --- Exams ---
        window.openModal = () => { document.getElementById('exam-modal').classList.remove('hidden'); document.getElementById('q-container').innerHTML=''; window.addQuestion(); };
        window.closeModal = () => document.getElementById('exam-modal').classList.add('hidden');
        window.addQuestion = () => {
            const id = Date.now();
            const h = `<div class="bg-white p-4 rounded-xl border relative q-item" id="q-${id}"><button onclick="document.getElementById('q-${id}').remove()" class="absolute top-2 right-2 text-red-500"><i class="fas fa-trash"></i></button><textarea class="w-full mb-2 q-txt border rounded p-2 text-sm font-bold" placeholder="Question (Use \\( .. \\) for Math)"></textarea><input class="q-img mb-2 text-xs border rounded p-2" placeholder="Image URL"><div class="grid grid-cols-2 gap-2 mb-2">${[0,1,2,3].map(i=>`<input class="q-opt-${i} border rounded p-2 text-xs" placeholder="Option ${String.fromCharCode(65+i)}">`).join('')}</div><div class="flex gap-2"><select class="q-ans border rounded p-2 text-xs font-bold"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><input class="q-sol border rounded p-2 text-xs flex-grow" placeholder="Solution"></div></div>`;
            document.getElementById('q-container').insertAdjacentHTML('beforeend', h);
        };
        window.publishExam = async () => {
            let qs=[]; document.querySelectorAll('.q-item').forEach(q => { const txt=q.querySelector('.q-txt').value, img=q.querySelector('.q-img').value, opts=[0,1,2,3].map(i=>q.querySelector(`.q-opt-${i}`).value), ans=parseInt(q.querySelector('.q-ans').value), sol=q.querySelector('.q-sol').value; if(txt) qs.push({q:txt, img, options:opts, correct:ans, sol}); });
            if(qs.length===0) return alert("No questions!");
            await addDoc(collection(db,"exams"), {
                title:document.getElementById('ex-title').value, duration:parseInt(document.getElementById('ex-dur').value), batch:document.getElementById('ex-batch').value,
                subject:document.getElementById('ex-sub').value, posMarks:parseInt(document.getElementById('ex-pos').value), negMarks:parseInt(document.getElementById('ex-neg').value),
                randomize:document.getElementById('ex-random').checked, questions:qs, type:'native_exam', createdAt:serverTimestamp()
            });
            alert("Published!"); closeModal(); loadExams();
        };
        async function loadExams() { const s=await getDocs(query(collection(db,"exams"), orderBy("createdAt","desc"))); document.getElementById('exam-list').innerHTML=s.docs.map(d=>`<div class="glass p-4 flex justify-between"><div><div class="font-bold text-indigo-900">${d.data().title}</div><div class="text-xs text-slate-500">${d.data().subject}</div></div><button onclick="delExam('${d.id}')" class="text-red-500"><i class="fas fa-trash"></i></button></div>`).join(''); }
        window.delExam = async(id) => { if(confirm("Delete?")) await deleteDoc(doc(db,"exams",id)); loadExams(); };
        window.toggleLive = async() => { const url = document.getElementById('live-url').value; await setDoc(doc(db,"settings","live"),{active:!!url, url}); alert(url?"Live Started":"Live Ended"); };
        window.signOutAdmin = () => signOut(auth).then(()=>location.href="index.html");
    </script>
</body>
</html>
