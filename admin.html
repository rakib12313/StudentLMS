<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Admin Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Outfit', sans-serif; background: #f8fafc; }
        .glass { background: white; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; transition: 0.2s; }
        .btn:active { transform: scale(0.98); }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; }
        mjx-container { margin: 0 !important; }
    </style>
</head>
<body class="text-slate-800">

    <div class="max-w-6xl mx-auto p-6">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold text-xl">A</div>
                <div><h1 class="text-2xl font-bold">Admin Console</h1><p class="text-xs text-slate-500">Science Exam Management</p></div>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal()" class="btn bg-indigo-600 text-white shadow-lg shadow-indigo-200">+ Create Exam</button>
                <button id="logout-btn" class="btn border hover:bg-red-50 text-red-500"><i class="fas fa-power-off"></i></button>
            </div>
        </div>

        <!-- Dashboard -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="glass p-6"><div class="text-xs font-bold text-slate-400 uppercase">Total Students</div><h2 class="text-4xl font-bold mt-2" id="stat-users">0</h2></div>
            <div class="glass p-6"><div class="text-xs font-bold text-slate-400 uppercase">Active Exams</div><h2 class="text-4xl font-bold text-indigo-600 mt-2" id="stat-exams">0</h2></div>
            <div class="glass p-6"><div class="text-xs font-bold text-slate-400 uppercase">Submissions</div><h2 class="text-4xl font-bold text-green-600 mt-2" id="stat-subs">0</h2></div>
        </div>

        <!-- Exam List -->
        <div class="glass overflow-hidden">
            <div class="p-4 border-b bg-slate-50 font-bold text-sm text-slate-600">Exam Library</div>
            <div id="exam-list" class="divide-y divide-slate-100 max-h-96 overflow-y-auto"></div>
        </div>
    </div>

    <!-- EXAM MODAL -->
    <div id="exam-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-4xl rounded-2xl h-[90vh] flex flex-col shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg">Create Assessment</h3>
                <button onclick="document.getElementById('exam-modal').classList.add('hidden')" class="text-2xl text-slate-400">&times;</button>
            </div>
            
            <div class="flex-grow overflow-y-auto p-6 space-y-6">
                <!-- Settings -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 bg-slate-50 p-4 rounded-xl border">
                    <div class="col-span-2"><label class="text-xs font-bold uppercase text-slate-400">Title</label><input id="ex-title" class="font-bold" placeholder="e.g. Physics Ch-1"></div>
                    <div><label class="text-xs font-bold uppercase text-slate-400">Class</label><select id="ex-batch" class="bg-white"><option value="all">All</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></div>
                    <div><label class="text-xs font-bold uppercase text-slate-400">Duration (min)</label><input id="ex-dur" type="number"></div>
                    <div><label class="text-xs font-bold uppercase text-green-600">Correct (+)</label><input id="ex-pos" type="number" value="4"></div>
                    <div><label class="text-xs font-bold uppercase text-red-500">Wrong (-)</label><input id="ex-neg" type="number" value="1"></div>
                    <div class="col-span-2 flex items-center gap-2 border p-2 rounded bg-white"><input type="checkbox" id="ex-random" checked><span class="text-sm font-bold text-indigo-700">Shuffle Questions (Anti-Cheat)</span></div>
                </div>

                <!-- Tabs -->
                <div class="flex gap-4 border-b">
                    <button onclick="setMode('manual')" id="tab-manual" class="pb-2 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600">Manual Builder</button>
                    <button onclick="setMode('pdf')" id="tab-pdf" class="pb-2 text-sm font-bold text-slate-400">PDF Upload</button>
                    <button onclick="setMode('json')" id="tab-json" class="pb-2 text-sm font-bold text-slate-400">JSON Import</button>
                </div>

                <!-- Manual -->
                <div id="mode-manual" class="space-y-4">
                    <div id="q-container" class="space-y-4"></div>
                    <button onclick="addQuestion()" class="w-full py-3 border-2 border-dashed border-indigo-300 text-indigo-600 font-bold rounded-xl hover:bg-indigo-50">+ Add Question</button>
                </div>

                <!-- PDF -->
                <div id="mode-pdf" class="hidden space-y-3">
                    <input id="ex-file" type="file" class="text-sm border p-2 rounded">
                    <div class="flex gap-2"><input id="ex-count" type="number" placeholder="Total Qs" class="border p-2 rounded w-32"><button onclick="genKeys()" class="btn bg-slate-800 text-white text-xs">Generate OMR</button></div>
                    <div id="ex-keys" class="grid grid-cols-5 gap-2 max-h-40 overflow-y-auto"></div>
                </div>

                <!-- JSON -->
                <div id="mode-json" class="hidden">
                    <textarea id="json-input" class="w-full h-48 font-mono text-xs p-3 bg-slate-900 text-green-400 rounded-xl" placeholder='[{"q":"Unit of Force?","options":["N","J","W","Pa"],"correct":0,"sol":"Newton is SI unit"}]'></textarea>
                    <button onclick="parseJSON()" class="btn bg-indigo-600 text-white mt-2">Parse JSON</button>
                </div>
            </div>

            <div class="p-4 border-t flex justify-end"><button onclick="publishExam()" class="btn bg-green-600 text-white shadow-lg">🚀 Publish Exam</button></div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, getDocs, setDoc, addDoc, deleteDoc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let bulkData=[];

        onAuthStateChanged(auth, async(u) => {
            if(!u || (await getDoc(doc(db,"students",u.uid))).data().role!=='admin') location.href="index.html";
            init();
        });

        async function init() {
            const u = await getDocs(collection(db,"students"));
            const e = await getDocs(collection(db,"exams"));
            const r = await getDocs(collection(db,"results"));
            document.getElementById('stat-users').innerText = u.size;
            document.getElementById('stat-exams').innerText = e.size;
            document.getElementById('stat-subs').innerText = r.size;
            loadExams();
        }

        window.setMode = (m) => {
            ['manual','pdf','json'].forEach(x=>{ document.getElementById('mode-'+x).classList.toggle('hidden', x!==m); document.getElementById('tab-'+x).className = x===m ? "pb-2 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600" : "pb-2 text-sm font-bold text-slate-400"; });
            window.examMode = m;
        }; window.examMode = 'manual';

        window.addQuestion = () => {
            const id = Date.now();
            const h = `<div class="bg-white p-4 rounded-xl border relative q-item" id="q-${id}"><button onclick="document.getElementById('q-${id}').remove()" class="absolute top-2 right-2 text-red-500"><i class="fas fa-trash"></i></button><textarea class="w-full mb-2 q-txt border rounded p-2 text-sm font-bold" placeholder="Question (Use \\( .. \\) for Math)"></textarea><input class="q-img mb-2 text-xs border rounded p-2" placeholder="Image URL"><div class="grid grid-cols-2 gap-2 mb-2">${[0,1,2,3].map(i=>`<input class="q-opt-${i} border rounded p-2 text-xs" placeholder="Option ${String.fromCharCode(65+i)}">`).join('')}</div><div class="flex gap-2"><select class="q-ans border rounded p-2 text-xs font-bold"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select><input class="q-sol border rounded p-2 text-xs flex-grow" placeholder="Solution"></div></div>`;
            document.getElementById('q-container').insertAdjacentHTML('beforeend', h);
        };

        window.publishExam = async () => {
            const title = document.getElementById('ex-title').value;
            const dur = document.getElementById('ex-dur').value;
            if(!title || !dur) return alert("Fill Title/Duration");

            const data = { title, duration: parseInt(dur), batch: document.getElementById('ex-batch').value, posMarks: parseInt(document.getElementById('ex-pos').value), negMarks: parseInt(document.getElementById('ex-neg').value), randomize: document.getElementById('ex-random').checked, createdAt: serverTimestamp() };

            if(window.examMode === 'pdf') {
                const file = document.getElementById('ex-file').files[0];
                if(!file) return alert("Upload PDF");
                const f = new FormData(); f.append('file',file); f.append('upload_preset','lms_upload');
                const r = await fetch('https://api.cloudinary.com/v1_1/dpe74ejhl/upload', {method:'POST', body:f});
                const d = await r.json();
                data.type='pdf_exam'; data.fileUrl=d.secure_url; data.answerKey=[];
                document.querySelectorAll('.pk').forEach(s => data.answerKey.push(parseInt(s.value)));
            } else {
                data.type='native_exam'; data.questions = (window.examMode==='json') ? bulkData : [];
                if(window.examMode==='manual') {
                    document.querySelectorAll('.q-item').forEach(q => {
                        const txt=q.querySelector('.q-txt').value, img=q.querySelector('.q-img').value;
                        const opts=[0,1,2,3].map(i=>q.querySelector(`.q-opt-${i}`).value);
                        if(txt||img) data.questions.push({q:txt, img, options:opts, correct:parseInt(q.querySelector('.q-ans').value), sol:q.querySelector('.q-sol').value});
                    });
                }
            }
            await addDoc(collection(db,"exams"), data); alert("Published!"); location.reload();
        };

        window.loadExams = async() => {
            const s = await getDocs(query(collection(db,"exams"), orderBy("createdAt","desc")));
            document.getElementById('exam-list').innerHTML = s.docs.map(d=>`<div class="p-4 flex justify-between items-center hover:bg-slate-50"><div><span class="font-bold block text-sm">${d.data().title}</span><span class="text-xs text-slate-400 bg-white border px-1 rounded">${d.data().type} • ${d.data().batch}</span></div><button onclick="delExam('${d.id}')" class="text-red-500"><i class="fas fa-trash"></i></button></div>`).join('');
        };
        window.parseJSON = () => { try { bulkData=JSON.parse(document.getElementById('json-input').value); alert("Parsed!"); } catch(e){alert("Invalid JSON");} };
        window.genKeys = () => { const c=document.getElementById('ex-count').value; let h=''; for(let i=0;i<c;i++) h+=`<select class="pk border p-1 text-[10px]"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>`; document.getElementById('ex-keys').innerHTML=h; };
        window.openModal = () => document.getElementById('exam-modal').classList.remove('hidden');
        window.delExam = async(id) => { if(confirm("Delete?")) await deleteDoc(doc(db,"exams",id)); loadExams(); };
        document.getElementById('logout-btn').addEventListener('click', () => signOut(auth).then(()=>location.reload()));
    </script>
</body>
</html>
