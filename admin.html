<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Science Exam Controller</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- MathJax for Formulas -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- Header -->
    <div class="h-16 bg-white border-b flex items-center justify-between px-6 sticky top-0 z-30 shadow-sm">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">S</div>
            <span class="font-bold text-lg hidden md:block">Science Admin</span>
        </div>
        <div class="flex gap-3">
            <button onclick="openExamModal()" class="btn btn-primary text-xs"><i class="fas fa-plus"></i> New Exam</button>
            <button onclick="signOutAdmin()" class="btn btn-outline text-xs text-red-500 hover:bg-red-50"><i class="fas fa-power-off"></i></button>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="max-w-6xl mx-auto p-6 space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="card p-4"><p class="text-[10px] font-bold text-slate-400 uppercase">Students</p><h1 id="stat-users" class="text-2xl font-bold">0</h1></div>
            <div class="card p-4"><p class="text-[10px] font-bold text-slate-400 uppercase">Exams</p><h1 id="stat-exams" class="text-2xl font-bold">0</h1></div>
        </div>

        <div class="card overflow-hidden">
            <div class="p-4 border-b bg-slate-50 font-bold text-sm text-slate-600">Published Assessments</div>
            <div id="exam-list" class="divide-y divide-slate-100 max-h-[70vh] overflow-y-auto"></div>
        </div>
    </div>

    <!-- EXAM CREATOR MODAL -->
    <div id="exam-modal" class="hidden fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-4xl rounded-2xl h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-lg">Create Exam</h3>
                <button onclick="document.getElementById('exam-modal').classList.add('hidden')" class="text-2xl text-slate-400 hover:text-red-500">&times;</button>
            </div>

            <div class="flex-grow overflow-y-auto p-6 space-y-6">
                <!-- 1. Configuration -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="col-span-2">
                            <label class="text-[10px] font-bold text-slate-400 uppercase">Title</label>
                            <input id="ex-title" class="w-full p-2 border rounded-lg text-sm font-bold" placeholder="e.g. Physics: Thermodynamics">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase">Class</label>
                            <select id="ex-batch" class="w-full p-2 border rounded-lg text-sm bg-white">
                                <option value="all">All</option>
                                <option value="6">Class 6</option>
                                <option value="7">Class 7</option>
                                <option value="8">Class 8</option>
                                <option value="9">Class 9</option>
                                <option value="10">Class 10</option>
                                <option value="11">Class 11</option>
                                <option value="12">Class 12</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-400 uppercase">Time (Min)</label>
                            <input id="ex-dur" type="number" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-green-600 uppercase">Correct (+)</label>
                            <input id="ex-pos" type="number" value="4" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-red-500 uppercase">Wrong (-)</label>
                            <input id="ex-neg" type="number" value="1" class="w-full p-2 border rounded-lg text-sm">
                        </div>
                        <div class="col-span-2 flex items-center gap-2 bg-white p-2 rounded border">
                            <input type="checkbox" id="ex-random" checked class="toggle-checkbox">
                            <span class="text-xs font-bold text-indigo-700">Shuffle Questions (Unique sets)</span>
                        </div>
                    </div>
                </div>

                <!-- 2. Modes -->
                <div class="flex gap-4 border-b">
                    <button onclick="setMode('manual')" id="tab-manual" class="pb-2 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600">Manual Entry</button>
                    <button onclick="setMode('bulk')" id="tab-bulk" class="pb-2 text-sm font-bold text-slate-400">⚡ Bulk JSON</button>
                    <button onclick="setMode('pdf')" id="tab-pdf" class="pb-2 text-sm font-bold text-slate-400">PDF Upload</button>
                </div>

                <!-- Manual Mode -->
                <div id="mode-manual" class="space-y-4">
                    <div id="q-container" class="space-y-4"></div>
                    <button onclick="addQuestion()" class="w-full py-3 border-2 border-dashed border-indigo-300 text-indigo-600 font-bold rounded-xl hover:bg-indigo-50">+ Add Question</button>
                </div>

                <!-- Bulk Mode -->
                <div id="mode-bulk" class="hidden space-y-2">
                    <p class="text-xs text-slate-500">JSON Format: [{"q":"...","img":"...","options":["..."],"correct":0,"sol":"..."}]</p>
                    <textarea id="json-input" class="w-full h-48 p-3 border rounded-xl text-xs font-mono bg-slate-50" placeholder="Paste JSON here..."></textarea>
                    <button onclick="parseJSON()" class="btn btn-outline w-full">Import Questions</button>
                </div>

                <!-- PDF Mode -->
                <div id="mode-pdf" class="hidden space-y-3">
                    <input id="ex-file" type="file" class="w-full text-xs p-2 border rounded bg-white">
                    <div class="flex gap-2">
                        <input id="ex-count" type="number" placeholder="Total Questions" class="w-full p-2 border rounded">
                        <button onclick="genKeys()" class="btn btn-outline">Generate OMR</button>
                    </div>
                    <div id="ex-keys" class="grid grid-cols-5 gap-2 max-h-40 overflow-y-auto"></div>
                </div>
            </div>

            <div class="p-4 border-t bg-slate-50 text-right">
                <button onclick="publishExam()" class="btn btn-primary px-6">Publish Exam</button>
            </div>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
    <script>
        function setMode(m) {
            ['manual','bulk','pdf'].forEach(x => {
                document.getElementById('mode-'+x).classList.toggle('hidden', x!==m);
                document.getElementById('tab-'+x).className = x===m ? "pb-2 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600" : "pb-2 text-sm font-bold text-slate-400";
            });
            window.examMode = m;
        }
        window.examMode = 'manual';
    </script>
</body>
</html>
