<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="toast-container"></div>
    
    <div class="min-h-screen flex flex-col md:flex-row">
        <nav class="bg-slate-900 text-white w-full md:w-64 flex-shrink-0 p-6 flex flex-col justify-between">
            <div>
                <div class="flex items-center gap-3 mb-10">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/50">A</div>
                    <span class="font-bold text-lg tracking-wide">Admin Console</span>
                </div>
                <div class="space-y-2">
                    <div class="p-3 rounded-lg bg-slate-800 text-sm font-bold border border-slate-700"><i class="fas fa-chart-pie mr-2 text-indigo-400"></i> Dashboard</div>
                    <div class="p-3 rounded-lg hover:bg-slate-800 text-sm font-medium transition cursor-pointer text-slate-400 hover:text-white"><i class="fas fa-users mr-2"></i> Students</div>
                    <div class="p-3 rounded-lg hover:bg-slate-800 text-sm font-medium transition cursor-pointer text-slate-400 hover:text-white"><i class="fas fa-layer-group mr-2"></i> Content</div>
                </div>
            </div>
            <div class="flex flex-col gap-3">
                <a href="index.html" class="text-xs bg-slate-800 p-3 rounded-lg font-bold text-center hover:bg-slate-700 transition">View Student App</a>
                <button id="logout-btn" class="text-xs bg-red-600 p-3 rounded-lg font-bold shadow-lg hover:bg-red-700 transition">Logout</button>
            </div>
        </nav>

        <div class="flex-grow p-4 md:p-8 overflow-y-auto">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div class="glass-card p-5 flex justify-between items-center bg-white">
                    <div>
                        <span class="font-bold text-slate-700 block mb-1">System Maintenance</span>
                        <p class="text-xs text-slate-400">Lock app for updates</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="maint-toggle" class="sr-only peer" onchange="toggleMaint()">
                        <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-red-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-red-600"></div>
                    </label>
                </div>
                <div class="glass-card p-5 bg-white">
                    <p class="text-xs font-bold text-slate-400 uppercase mb-2">Go Live</p>
                    <div class="flex gap-2">
                        <input id="live-topic" placeholder="Topic..." class="border rounded-lg p-2 text-xs w-1/3 bg-slate-50">
                        <input id="live-url" placeholder="Google Meet Link" class="border rounded-lg p-2 text-xs flex-grow bg-slate-50">
                        <button onclick="setLive()" class="bg-red-600 hover:bg-red-700 text-white px-4 rounded-lg text-xs font-bold shadow-md transition">LIVE</button>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden group">
                    <div class="absolute right-0 top-0 w-16 h-16 bg-blue-100 rounded-bl-full -mr-2 -mt-2 transition group-hover:bg-blue-200"></div>
                    <p class="text-xs text-slate-400 font-bold uppercase z-10 relative">Total Users</p>
                    <h2 id="stat-users" class="text-4xl font-bold text-slate-800 mt-2 z-10 relative">0</h2>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <p class="text-xs text-slate-400 font-bold uppercase">Pending</p>
                    <h2 id="stat-pending" class="text-4xl font-bold text-orange-500 mt-2">0</h2>
                </div>
                <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-center">
                    <div class="h-20 w-20"><canvas id="contentChart"></canvas></div>
                </div>
                <div class="bg-white p-2 rounded-2xl border border-slate-200 shadow-sm">
                    <button onclick="exportCSV()" class="w-full h-full bg-green-50 text-green-700 font-bold rounded-xl border border-green-100 hover:bg-green-100 transition flex flex-col items-center justify-center gap-1">
                        <i class="fas fa-file-csv text-xl"></i> <span>Export CSV</span>
                    </button>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-2 space-y-8">
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="bg-slate-50 p-5 border-b flex justify-between items-center">
                            <h3 class="font-bold text-slate-700">User Management</h3>
                            <button onclick="loadUsers()" class="text-xs bg-white border px-3 py-1 rounded-full shadow-sm hover:bg-slate-50"><i class="fas fa-sync"></i> Refresh</button>
                        </div>
                        <div class="p-4 border-b bg-blue-50/30 flex gap-2">
                            <input id="new-email" type="email" placeholder="New Student Email" class="flex-grow p-2.5 rounded-lg border border-slate-200 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <select id="new-batch" class="p-2.5 rounded-lg border border-slate-200 text-sm"><option value="all">All</option><option value="10">Class 10</option><option value="12">Class 12</option></select>
                            <button onclick="registerStudent()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 rounded-lg text-sm font-bold transition shadow-lg shadow-blue-500/30">Add</button>
                        </div>
                        <div id="user-list" class="max-h-80 overflow-y-auto divide-y divide-slate-100 p-2"></div>
                    </div>
                    
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                        <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fas fa-check-double text-green-500"></i> Homework Submissions</h3>
                        <div id="submission-list" class="max-h-60 overflow-y-auto space-y-2"></div>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-2xl p-6 text-white shadow-lg">
                        <h3 class="font-bold mb-3 text-sm uppercase tracking-wide opacity-80">Announcement</h3>
                        <textarea id="announce-text" class="w-full bg-white/10 border border-white/20 rounded-lg p-3 text-sm h-24 mb-3 text-white placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-white" placeholder="Write message..."></textarea>
                        <button onclick="updateAnnouncement()" class="w-full bg-white text-slate-900 py-2 rounded-lg text-sm font-bold hover:bg-slate-200 transition">Update Notice Board</button>
                    </div>
                    
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                        <h3 class="font-bold text-slate-700 mb-4">Upload Materials</h3>
                        <div class="space-y-3">
                            <select id="note-batch" class="w-full border rounded-lg p-2.5 text-xs bg-slate-50"><option value="all">Target: All Batches</option><option value="10">Class 10</option><option value="12">Class 12</option></select>
                            <input id="note-title" placeholder="Material Title" class="w-full border rounded-lg p-2.5 text-sm">
                            <input id="note-file" type="file" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                            <button id="upload-btn" class="w-full bg-green-600 hover:bg-green-700 text-white py-2.5 rounded-lg text-sm font-bold shadow-md transition">Upload Note</button>
                        </div>
                    </div>
                    
                    <button onclick="document.getElementById('pdf-exam-modal').classList.remove('hidden')" class="w-full border-2 border-dashed border-pink-300 bg-pink-50 text-pink-600 py-4 rounded-xl font-bold hover:bg-pink-100 transition">
                        <i class="fas fa-plus-circle mr-2"></i> Create PDF Exam
                    </button>
                    
                    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                        <h3 class="font-bold text-slate-700 mb-4">Assign Homework</h3>
                        <input id="hw-title" placeholder="Task Title" class="w-full border rounded-lg p-2.5 text-sm mb-3">
                        <input id="hw-date" type="date" class="w-full border rounded-lg p-2.5 text-sm mb-3">
                        <button onclick="postHW()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg text-sm font-bold shadow-md transition">Post Assignment</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="pdf-exam-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl h-[85vh] flex flex-col p-6 shadow-2xl">
            <div class="flex justify-between mb-6 items-center border-b pb-4">
                <h3 class="font-bold text-lg text-slate-800">Create PDF Exam</h3>
                <button onclick="document.getElementById('pdf-exam-modal').classList.add('hidden')" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center">&times;</button>
            </div>
            <div class="space-y-4 flex-grow overflow-y-auto">
                <input id="pe-title" placeholder="Exam Title" class="w-full border p-3 rounded-xl bg-slate-50">
                <input id="pe-dur" type="number" placeholder="Duration (Minutes)" class="w-full border p-3 rounded-xl bg-slate-50">
                <div class="p-3 border rounded-xl bg-slate-50">
                     <p class="text-xs text-slate-500 mb-1">Question PDF</p>
                     <input id="pe-file" type="file" class="text-xs w-full">
                </div>
                <div class="flex gap-2">
                    <input id="pe-count" type="number" placeholder="# Questions" class="w-full border p-3 rounded-xl bg-slate-50">
                    <button onclick="genKeys()" class="bg-slate-800 text-white px-4 rounded-xl text-xs font-bold whitespace-nowrap">Gen Keys</button>
                </div>
                <div id="pe-keys" class="grid grid-cols-4 gap-2 max-h-40 overflow-y-auto p-2 bg-slate-50 rounded-xl"></div>
            </div>
            <button onclick="pubPDF()" class="w-full bg-pink-600 hover:bg-pink-700 text-white py-3 rounded-xl font-bold mt-4 shadow-lg shadow-pink-500/30 transition">Publish Exam</button>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
