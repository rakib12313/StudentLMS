<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nebula Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #6366f1; --surface: rgba(255, 255, 255, 0.85); }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f0f4f8; overflow-x: hidden; }
        
        /* Animated Background */
        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1;
            background: radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                        radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                        radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-size: 200% 200%; animation: gradient 15s ease infinite;
        }
        @keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* Glass UI */
        .glass {
            background: var(--surface); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07); transition: 0.3s;
        }
        .glass:hover { transform: translateY(-2px); box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.1); }
        
        /* Sidebar */
        .sidebar-link { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #475569; font-weight: 600; transition: 0.2s; cursor: pointer; }
        .sidebar-link:hover, .sidebar-link.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        
        /* Inputs */
        input, select, textarea { width: 100%; background: rgba(255,255,255,0.6); border: 1px solid #cbd5e1; padding: 10px; border-radius: 10px; outline: none; transition: 0.2s; font-size: 13px; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }

        .hidden { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        mjx-container { margin: 0 !important; }
    </style>
</head>
<body class="text-slate-800">
    <div class="mesh-bg"></div>

    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 glass m-4 flex flex-col justify-between hidden md:flex">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg">N</div>
                    <span class="font-bold text-xl text-white">Admin</span>
                </div>
                <nav class="space-y-2">
                    <div onclick="switchTab('dashboard')" id="nav-dashboard" class="sidebar-link active"><i class="fas fa-chart-pie"></i> Dashboard</div>
                    <div onclick="switchTab('exams')" id="nav-exams" class="sidebar-link"><i class="fas fa-scroll"></i> Exam Manager</div>
                    <div onclick="switchTab('students')" id="nav-students" class="sidebar-link"><i class="fas fa-users"></i> Students</div>
                    <div onclick="switchTab('results')" id="nav-results" class="sidebar-link"><i class="fas fa-trophy"></i> Results</div>
                </nav>
            </div>
            <div class="p-6">
                <button onclick="signOutAdmin()" class="w-full py-3 bg-white/20 border border-white/30 text-white rounded-xl font-bold hover:bg-red-500 hover:border-red-500 transition">Log Out</button>
            </div>
        </aside>

        <!-- Main -->
        <main class="flex-1 overflow-y-auto p-4 md:p-8">
            <!-- Top Bar Mobile -->
            <div class="md:hidden flex justify-between items-center mb-6 glass p-4">
                <span class="font-bold text-lg text-indigo-700">Nebula Admin</span>
                <button onclick="signOutAdmin()" class="text-red-500"><i class="fas fa-power-off"></i></button>
            </div>

            <!-- VIEW: Dashboard -->
            <div id="view-dashboard" class="space-y-6 fade-in">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="glass p-6 text-center">
                        <div class="w-12 h-12 mx-auto bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mb-2"><i class="fas fa-user-graduate"></i></div>
                        <h2 class="text-3xl font-bold" id="stat-users">0</h2>
                        <p class="text-xs font-bold text-slate-500 uppercase">Total Students</p>
                    </div>
                    <div class="glass p-6 text-center">
                        <div class="w-12 h-12 mx-auto bg-pink-100 text-pink-600 rounded-full flex items-center justify-center mb-2"><i class="fas fa-file-contract"></i></div>
                        <h2 class="text-3xl font-bold" id="stat-exams">0</h2>
                        <p class="text-xs font-bold text-slate-500 uppercase">Active Exams</p>
                    </div>
                    <div class="glass p-6 text-center">
                        <div class="w-12 h-12 mx-auto bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-2"><i class="fas fa-check-circle"></i></div>
                        <h2 class="text-3xl font-bold" id="stat-attempts">0</h2>
                        <p class="text-xs font-bold text-slate-500 uppercase">Total Attempts</p>
                    </div>
                </div>

                <div class="glass p-6">
                    <h3 class="font-bold text-lg mb-4 text-indigo-900">🚀 Quick Actions</h3>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <button onclick="openExamModal()" class="p-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg shadow-indigo-500/30 hover:scale-105 transition">
                            <i class="fas fa-plus mb-2 block text-xl"></i> Create Exam
                        </button>
                        <button onclick="switchTab('results')" class="p-4 bg-white border text-slate-600 rounded-xl font-bold hover:bg-slate-50">
                            <i class="fas fa-download mb-2 block text-xl"></i> Export Data
                        </button>
                    </div>
                </div>
            </div>

            <!-- VIEW: Exams -->
            <div id="view-exams" class="hidden space-y-6 fade-in">
                <div class="flex justify-between items-center">
                    <h2 class="text-2xl font-bold text-white">Exam Manager</h2>
                    <button onclick="openExamModal()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold shadow-lg">+ New</button>
                </div>
                <div id="exam-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>

            <!-- VIEW: Students -->
            <div id="view-students" class="hidden space-y-6 fade-in">
                <div class="glass p-4 flex gap-2">
                    <input id="search-student" placeholder="Search by name or email..." onkeyup="filterStudents()">
                </div>
                <div id="student-list" class="space-y-2"></div>
            </div>

            <!-- VIEW: Results -->
            <div id="view-results" class="hidden space-y-6 fade-in">
                <div class="flex justify-between">
                    <h2 class="text-2xl font-bold text-white">Results Log</h2>
                    <button onclick="exportCSV()" class="px-4 py-2 bg-green-600 text-white rounded-lg font-bold"><i class="fas fa-file-csv"></i> Download CSV</button>
                </div>
                <div class="glass overflow-hidden">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-indigo-50 text-indigo-900 uppercase font-bold text-xs">
                            <tr><th class="p-4">Student</th><th class="p-4">Exam</th><th class="p-4">Score</th><th class="p-4">Date</th></tr>
                        </thead>
                        <tbody id="results-table" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- CREATE EXAM MODAL -->
    <div id="exam-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-5xl rounded-2xl h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 border-b flex justify-between items-center bg-indigo-50">
                <h3 class="font-bold text-lg text-indigo-900">✨ Create Assessment</h3>
                <button onclick="document.getElementById('exam-modal').classList.add('hidden')" class="w-8 h-8 rounded-full bg-white text-slate-500 hover:text-red-500">&times;</button>
            </div>

            <div class="flex-grow overflow-y-auto p-6 space-y-6 bg-slate-50">
                <!-- Config -->
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="col-span-2"><label class="text-xs font-bold text-slate-400 uppercase">Exam Title</label><input id="ex-title" class="font-bold" placeholder="e.g. Thermodynamics Test 1"></div>
                    <div><label class="text-xs font-bold text-slate-400 uppercase">Subject</label><select id="ex-sub"><option>Physics</option><option>Chemistry</option><option>Maths</option><option>Biology</option></select></div>
                    <div><label class="text-xs font-bold text-slate-400 uppercase">Duration (Min)</label><input id="ex-dur" type="number"></div>
                    <div><label class="text-xs font-bold text-green-600 uppercase">Correct (+)</label><input id="ex-pos" type="number" value="4"></div>
                    <div><label class="text-xs font-bold text-red-500 uppercase">Wrong (-)</label><input id="ex-neg" type="number" value="1"></div>
                    <div class="col-span-2 flex items-center gap-3 p-2 bg-indigo-50 rounded-xl border border-indigo-100">
                        <input type="checkbox" id="ex-random" checked class="w-5 h-5 accent-indigo-600">
                        <span class="text-sm font-bold text-indigo-700">Randomize Questions for each student</span>
                    </div>
                </div>

                <!-- Builder -->
                <div id="q-container" class="space-y-4"></div>
                
                <button onclick="addQuestion()" class="w-full py-4 border-2 border-dashed border-indigo-300 text-indigo-600 font-bold rounded-xl hover:bg-indigo-50 transition">+ Add Question</button>
            </div>

            <div class="p-4 border-t bg-white flex justify-end">
                <button onclick="publishExam()" class="px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:scale-105 transition">Publish Live</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, getDoc, collection, getDocs, setDoc, addDoc, deleteDoc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allStudents = [];

        onAuthStateChanged(auth, async (user) => {
            if(!user || (await getDoc(doc(db, "students", user.uid))).data().role !== "admin") location.href="index.html";
            initAdmin();
        });

        async function initAdmin() {
            const u = await getDocs(collection(db, "students"));
            const e = await getDocs(collection(db, "exams"));
            const r = await getDocs(collection(db, "results"));
            
            document.getElementById('stat-users').innerText = u.size;
            document.getElementById('stat-exams').innerText = e.size;
            document.getElementById('stat-attempts').innerText = r.size;

            loadExams();
            loadStudents();
            loadResults();
        }

        window.switchTab = (tab) => {
            ['dashboard','exams','students','results'].forEach(t => {
                document.getElementById('view-'+t).classList.add('hidden');
                document.getElementById('nav-'+t)?.classList.remove('active');
            });
            document.getElementById('view-'+tab).classList.remove('hidden');
            document.getElementById('nav-'+tab)?.classList.add('active');
        };

        // --- STUDENTS ---
        async function loadStudents() {
            const s = await getDocs(collection(db, "students"));
            allStudents = [];
            s.forEach(doc => allStudents.push({id: doc.id, ...doc.data()}));
            renderStudents(allStudents);
        }

        function renderStudents(list) {
            document.getElementById('student-list').innerHTML = list.map(s => `
                <div class="glass p-3 flex justify-between items-center">
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center font-bold text-indigo-600">${s.name[0]}</div>
                        <div><div class="font-bold text-sm">${s.name}</div><div class="text-[10px] text-slate-500">${s.email}</div></div>
                    </div>
                    <div class="flex gap-2">
                        ${s.banned ? `<button onclick="banUser('${s.id}', false)" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded font-bold">Unban</button>` : `<button onclick="banUser('${s.id}', true)" class="text-xs bg-red-100 text-red-700 px-3 py-1 rounded font-bold">Ban</button>`}
                        ${s.deviceId ? `<button onclick="resetDevice('${s.id}')" class="text-xs bg-orange-100 text-orange-700 px-3 py-1 rounded font-bold">Unlock</button>` : ''}
                    </div>
                </div>
            `).join('');
        }

        window.filterStudents = () => {
            const q = document.getElementById('search-student').value.toLowerCase();
            renderStudents(allStudents.filter(s => s.name.toLowerCase().includes(q) || s.email.toLowerCase().includes(q)));
        };

        window.banUser = async(id, status) => { await updateDoc(doc(db,"students",id), {banned: status}); loadStudents(); };
        window.resetDevice = async(id) => { await updateDoc(doc(db,"students",id), {deviceId: null}); alert("Unlocked!"); loadStudents(); };

        // --- EXAMS ---
        window.addQuestion = () => {
            const id = Date.now();
            const h = `
            <div class="p-5 bg-white border border-slate-200 rounded-xl relative q-item shadow-sm" id="q-${id}">
                <button onclick="document.getElementById('q-${id}').remove()" class="absolute top-2 right-2 text-slate-300 hover:text-red-500"><i class="fas fa-trash"></i></button>
                <div class="space-y-3">
                    <div class="bg-slate-50 p-2 rounded flex gap-2">
                        <button class="px-2 py-1 bg-white border rounded text-[10px] font-bold" onclick="insertText('txt-${id}','\\\\( ',' \\\\)')">Math</button>
                        <button class="px-2 py-1 bg-white border rounded text-[10px] font-bold" onclick="insertText('txt-${id}','**','**')">Bold</button>
                    </div>
                    <textarea id="txt-${id}" class="w-full p-3 border rounded-lg font-bold text-sm bg-slate-50 q-txt focus:bg-white" rows="2" placeholder="Question Text..."></textarea>
                    <input class="q-img p-2 border rounded text-xs" placeholder="Image URL (Optional)">
                    <div class="grid grid-cols-2 gap-3">
                        ${[0,1,2,3].map(i => `<div class="flex items-center gap-2"><span class="font-bold text-slate-400 text-xs">${String.fromCharCode(65+i)}</span><input class="q-opt-${i} border rounded p-2 text-xs"></div>`).join('')}
                    </div>
                    <div class="flex gap-4 pt-2">
                        <select class="w-1/3 p-2 border rounded text-xs font-bold q-ans bg-green-50 text-green-700"><option value="0">A</option><option value="1">B</option><option value="2">C</option><option value="3">D</option></select>
                        <input class="w-2/3 p-2 border rounded text-xs q-sol" placeholder="Explanation (Solution)">
                    </div>
                </div>
            </div>`;
            document.getElementById('q-container').insertAdjacentHTML('beforeend', h);
        };

        window.insertText = (id, s, e) => {
            const el = document.getElementById(id);
            el.setRangeText(s + el.value.substring(el.selectionStart, el.selectionEnd) + e);
        };

        window.publishExam = async () => {
            const title = document.getElementById('ex-title').value;
            const dur = document.getElementById('ex-dur').value;
            if(!title || !dur) return alert("Fill Title & Duration");

            let qs = [];
            document.querySelectorAll('.q-item').forEach(q => {
                const txt = q.querySelector('.q-txt').value;
                const img = q.querySelector('.q-img').value;
                const opts = [0,1,2,3].map(i => q.querySelector(`.q-opt-${i}`).value);
                const ans = parseInt(q.querySelector('.q-ans').value);
                const sol = q.querySelector('.q-sol').value;
                if(txt) qs.push({ q: txt, img, options: opts, correct: ans, sol });
            });

            await addDoc(collection(db,"exams"), {
                title, duration: parseInt(dur), subject: document.getElementById('ex-sub').value,
                posMarks: parseInt(document.getElementById('ex-pos').value), 
                negMarks: parseInt(document.getElementById('ex-neg').value),
                randomize: document.getElementById('ex-random').checked,
                questions: qs, createdAt: serverTimestamp()
            });
            alert("Exam Published!"); location.reload();
        };

        async function loadExams() {
            const s = await getDocs(query(collection(db, "exams"), orderBy("createdAt", "desc")));
            document.getElementById('exam-list').innerHTML = s.docs.map(d => `
                <div class="glass p-4 flex justify-between items-center">
                    <div>
                        <span class="font-bold block text-indigo-900">${d.data().title}</span>
                        <span class="text-[10px] font-bold bg-white px-2 py-1 rounded text-slate-500">${d.data().subject} • ${d.data().duration}m</span>
                    </div>
                    <button onclick="deleteExam('${d.id}')" class="text-red-400 hover:text-red-600"><i class="fas fa-trash"></i></button>
                </div>`).join('');
        }
        window.deleteExam = async(id) => { if(confirm("Delete?")) await deleteDoc(doc(db,"exams",id)); loadExams(); };

        // --- RESULTS ---
        async function loadResults() {
            const s = await getDocs(query(collection(db,"results"), orderBy("timestamp","desc"), orderBy("score","desc")));
            let csvContent = "data:text/csv;charset=utf-8,Student,Exam,Score,Date\n";
            let html = "";
            
            s.forEach(d => {
                const r = d.data();
                const date = r.timestamp ? new Date(r.timestamp.seconds*1000).toLocaleDateString() : '-';
                csvContent += `${r.studentName},${r.examTitle},${r.score},${date}\n`;
                html += `<tr class="hover:bg-slate-50 border-b">
                    <td class="p-4 font-bold text-slate-700">${r.studentName}</td>
                    <td class="p-4">${r.examTitle}</td>
                    <td class="p-4 font-bold text-indigo-600">${r.score}</td>
                    <td class="p-4 text-xs text-slate-400">${date}</td>
                </tr>`;
            });
            document.getElementById('results-table').innerHTML = html;
            window.csvUri = encodeURI(csvContent);
        }

        window.exportCSV = () => { window.open(window.csvUri); };
        window.openExamModal = () => document.getElementById('exam-modal').classList.remove('hidden');
        window.signOutAdmin = () => signOut(auth).then(()=>location.href="index.html");
        window.addQuestion = window.addQuestion; // Expose
    </script>
</body>
</html>
