<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Admin Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800">
    
    <!-- Mobile Header -->
    <div class="md:hidden glass-panel m-2 p-4 flex justify-between items-center sticky top-2 z-50">
        <span class="font-bold text-lg text-indigo-600">Admin Console</span>
        <button onclick="signOutAdmin()" class="text-xs bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold">Logout</button>
    </div>

    <div class="min-h-screen flex flex-col md:flex-row max-w-7xl mx-auto">
        
        <!-- Sidebar -->
        <nav class="hidden md:flex bg-white w-64 flex-shrink-0 p-6 flex-col justify-between border-r sticky top-0 h-screen">
            <div>
                <div class="flex items-center gap-3 mb-10">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center font-bold text-white shadow-lg">A</div>
                    <span class="font-bold text-lg">Smart LMS</span>
                </div>
                <div class="space-y-1">
                    <div class="p-3 rounded-lg bg-indigo-50 text-indigo-700 font-bold text-sm"><i class="fas fa-chart-pie mr-2"></i> Dashboard</div>
                    <div class="p-3 rounded-lg hover:bg-slate-50 text-slate-500 font-medium text-sm cursor-pointer" onclick="document.getElementById('user-mgmt').scrollIntoView({behavior:'smooth'})"><i class="fas fa-users mr-2"></i> Students</div>
                    <div class="p-3 rounded-lg hover:bg-slate-50 text-slate-500 font-medium text-sm cursor-pointer" onclick="document.getElementById('content-mgmt').scrollIntoView({behavior:'smooth'})"><i class="fas fa-layer-group mr-2"></i> Content</div>
                </div>
            </div>
            <button onclick="signOutAdmin()" class="w-full bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold hover:bg-red-100 transition">Logout</button>
        </nav>

        <!-- Main Content -->
        <div class="flex-grow p-4 md:p-8 overflow-y-auto pb-24">
            
            <!-- Quick Actions -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <!-- Live Class Control -->
                <div class="glass-card p-5 bg-white border-l-4 border-red-500 shadow-sm">
                    <div class="flex justify-between items-center mb-3">
                        <span class="font-bold text-red-600 uppercase text-xs tracking-wider">🔴 Live Class Control</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="live-toggle" class="sr-only peer" onchange="toggleLive()">
                            <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-red-600"></div>
                        </label>
                    </div>
                    <div class="flex flex-col gap-2">
                        <input id="live-topic" placeholder="Topic (e.g., Physics Ch-1)" class="border rounded p-2 text-xs bg-slate-50">
                        <input id="live-url" placeholder="Paste Meet/Zoom Link" class="border rounded p-2 text-xs bg-slate-50">
                    </div>
                </div>

                <!-- System Stats -->
                <div class="glass-card p-5 bg-white border-l-4 border-indigo-500 shadow-sm flex items-center justify-between">
                    <div>
                        <p class="text-xs text-slate-400 font-bold uppercase">Active Students</p>
                        <h2 id="stat-users" class="text-3xl font-bold text-slate-800 mt-1">0</h2>
                    </div>
                    <div class="h-16 w-16"><canvas id="miniChart"></canvas></div>
                </div>
            </div>

            <!-- Student Management -->
            <div id="user-mgmt" class="bg-white rounded-xl border border-slate-200 shadow-sm mb-6 overflow-hidden">
                <div class="p-4 border-b bg-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                    <h3 class="font-bold text-slate-700">Student Database</h3>
                    <div class="flex gap-2 w-full md:w-auto">
                        <input id="new-email" type="email" placeholder="Email" class="flex-grow md:w-48 p-2 rounded border text-xs">
                        <select id="new-batch" class="p-2 rounded border text-xs bg-white">
                            <option value="10">Class 10</option>
                            <option value="11">Class 11</option>
                            <option value="12">Class 12</option>
                        </select>
                        <button onclick="registerStudent()" class="bg-indigo-600 text-white px-4 rounded text-xs font-bold hover:bg-indigo-700">Add</button>
                    </div>
                </div>
                <div id="user-list" class="max-h-64 overflow-y-auto divide-y divide-slate-100"></div>
            </div>

            <!-- Content Upload -->
            <div id="content-mgmt" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Notes/Materials -->
                <div class="bg-white rounded-xl border border-slate-200 p-5 shadow-sm">
                    <h3 class="font-bold text-slate-700 mb-4 flex items-center gap-2"><i class="fas fa-file-pdf text-red-500"></i> Upload Material</h3>
                    <div class="space-y-3">
                        <select id="note-batch" class="w-full border rounded p-2 text-xs bg-slate-50">
                            <option value="all">All Batches</option>
                            <option value="10">Class 10</option>
                            <option value="11">Class 11</option>
                            <option value="12">Class 12</option>
                        </select>
                        <input id="note-title" placeholder="Title (e.g. Algebra Formulas)" class="w-full border rounded p-2 text-xs">
                        <input id="note-file" type="file" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded-full file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        <button id="upload-btn" class="w-full bg-slate-800 text-white py-2 rounded text-xs font-bold hover:bg-black transition">Upload to Cloud</button>
                    </div>
                </div>

                <!-- Actions -->
                <div class="space-y-4">
                    <button onclick="document.getElementById('pdf-exam-modal').classList.remove('hidden')" class="w-full bg-pink-50 border border-pink-100 text-pink-600 py-4 rounded-xl font-bold hover:bg-pink-100 transition flex items-center justify-center gap-2">
                        <i class="fas fa-pen-alt"></i> Create Exam
                    </button>
                    <div class="bg-indigo-600 rounded-xl p-4 text-white shadow-lg">
                        <p class="text-xs font-bold opacity-70 uppercase mb-2">Announcement</p>
                        <textarea id="announce-text" class="w-full bg-white/10 border border-white/20 rounded p-2 text-xs text-white mb-2" rows="2" placeholder="Message..."></textarea>
                        <button onclick="updateAnnouncement()" class="w-full bg-white text-indigo-700 py-1.5 rounded text-xs font-bold">Post Update</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Exam Modal (Simplified) -->
    <div id="pdf-exam-modal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-xl p-6 shadow-2xl h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="font-bold">New Exam</h3>
                <button onclick="document.getElementById('pdf-exam-modal').classList.add('hidden')" class="text-2xl">&times;</button>
            </div>
            <div class="space-y-3 flex-grow overflow-y-auto">
                <select id="pe-batch" class="w-full border rounded p-2 text-sm"><option value="all">All</option><option value="10">Class 10</option><option value="12">Class 12</option></select>
                <input id="pe-title" placeholder="Exam Title" class="w-full border p-2 rounded text-sm">
                <input id="pe-dur" type="number" placeholder="Duration (Mins)" class="w-full border p-2 rounded text-sm">
                <input id="pe-file" type="file" class="text-xs w-full">
                <div class="flex gap-2">
                    <input id="pe-count" type="number" placeholder="# Qs" class="w-full border p-2 rounded text-sm">
                    <button onclick="genKeys()" class="bg-slate-800 text-white px-3 rounded text-xs">Set Keys</button>
                </div>
                <div id="pe-keys" class="grid grid-cols-4 gap-2"></div>
            </div>
            <button onclick="pubPDF()" class="w-full bg-indigo-600 text-white py-3 rounded font-bold mt-2">Publish</button>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
    <script>window.signOutAdmin = () => location.href="index.html";</script>
</body>
</html>
