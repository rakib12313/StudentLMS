<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonLMS - Student Examination System</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- THEME & CSS --- */
        :root {
            --primary: #7000ff;
            --primary-glow: #bd00ff;
            --secondary: #00f7ff;
            --bg-dark: #050505;
            --glass-bg: rgba(20, 20, 25, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --success: #00ff9d;
            --danger: #ff0055;
            --radius: 16px;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #000 70%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .hidden { display: none !important; }
        .flex-center { display: flex; justify-content: center; align-items: center; min-height: 80vh; }

        /* Modern Glass Card */
        .card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
        }

        /* Inputs & Buttons */
        input, select {
            width: 100%; padding: 14px; margin-bottom: 12px;
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            border-radius: 10px; color: white; font-family: inherit;
            box-sizing: border-box;
        }
        
        button {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            font-weight: 600; font-size: 16px; cursor: pointer;
            transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .btn-primary { background: linear-gradient(45deg, var(--primary), var(--primary-glow)); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-danger { background: rgba(255, 0, 85, 0.15); color: var(--danger); border: 1px solid var(--danger); }
        .btn-google { background: white; color: #333; margin-top: 10px; }

        /* Toast */
        #toast-box { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast {
            background: #1e1e24; border-left: 4px solid var(--primary);
            padding: 15px 20px; margin-bottom: 10px; border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: slideIn 0.3s;
            display: flex; align-items: center; gap: 10px; font-size: 14px;
        }
        .toast.error { border-color: var(--danger); }
        @keyframes slideIn { from{transform:translateX(100%)} to{transform:translateX(0)} }

        /* Loader */
        #global-loader {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: #000; z-index: 99999; display: flex;
            flex-direction: column; justify-content: center; align-items: center;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--secondary); border-radius: 50%;
            animation: spin 1s infinite linear; margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Nav */
        .bottom-nav {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(30,30,40,0.9); border: 1px solid var(--glass-border);
            border-radius: 30px; padding: 15px 30px; display: flex; gap: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 1000;
        }
        .nav-icon { font-size: 22px; color: var(--text-muted); cursor: pointer; transition: 0.3s; }
        .nav-icon.active { color: var(--secondary); transform: translateY(-3px); text-shadow: 0 0 10px var(--secondary); }

        /* Exam Qs */
        .q-box { background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        .opt-label { display: flex; padding: 10px; background: rgba(0,0,0,0.2); margin: 5px 0; border-radius: 8px; cursor: pointer; }
        input[type="radio"]:checked + span { color: var(--success); font-weight: bold; }
    </style>
</head>
<body>

    <!-- SYSTEM LOADER -->
    <div id="global-loader">
        <div class="spinner"></div>
        <div style="color: #888; font-size: 14px;">Connecting to System...</div>
    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div id="toast-box"></div>

    <!-- === VIEW: LOGIN === -->
    <div id="view-auth" class="container flex-center hidden">
        <div class="card" style="width: 100%; text-align: center;">
            <i class="fas fa-atom" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
            <h2 style="margin: 0 0 5px 0;">Neon LMS</h2>
            <p style="color: #888; margin-bottom: 25px;">Secure Examination Portal</p>
            
            <div id="login-form">
                <input type="email" id="email" placeholder="Email">
                <input type="password" id="password" placeholder="Password">
                <button class="btn-primary" onclick="app.login()">Login</button>
                <button class="btn-google" onclick="app.loginGoogle()"><i class="fab fa-google"></i> Google Login</button>
                <p style="margin-top: 15px; font-size: 13px;">
                    New? <a href="#" style="color: var(--secondary);" onclick="document.getElementById('login-form').classList.add('hidden'); document.getElementById('reg-form').classList.remove('hidden');">Create Account</a>
                </p>
            </div>

            <div id="reg-form" class="hidden">
                <h3 style="margin-top:0;">Register</h3>
                <input type="email" id="reg-email" placeholder="New Email">
                <input type="password" id="reg-pass" placeholder="Create Password (6+ chars)">
                <button class="btn-primary" onclick="app.register()">Create Account</button>
                <p style="margin-top: 15px; font-size: 13px;">
                    <a href="#" style="color: #888;" onclick="document.getElementById('reg-form').classList.add('hidden'); document.getElementById('login-form').classList.remove('hidden');">Back to Login</a>
                </p>
            </div>
        </div>
    </div>

    <!-- === VIEW: ADMIN === -->
    <div id="view-admin" class="container hidden">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h2 style="margin:0; color: var(--secondary);">Admin Panel</h2>
                <small>Manage Exams</small>
            </div>
            <button class="btn-danger" style="width: auto; padding: 8px 15px;" onclick="app.logout()">Logout</button>
        </div>

        <div class="card">
            <h3>Create Exam</h3>
            <input type="text" id="exam-title" placeholder="Exam Title">
            <input type="number" id="exam-time" placeholder="Duration (minutes)">
            <div id="q-builder"></div>
            <button class="btn-secondary" onclick="app.addQField()" style="margin-bottom:10px;">+ Add Question</button>
            <button class="btn-primary" onclick="app.saveExam()" id="btn-pub">Publish Exam</button>
        </div>
        
        <h3>Existing Exams</h3>
        <div id="admin-list"></div>
    </div>

    <!-- === VIEW: STUDENT === -->
    <div id="view-student" class="container hidden">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0;">Dashboard</h2>
            <button class="btn-danger" style="width: auto; padding: 8px 15px;" onclick="app.logout()"><i class="fas fa-power-off"></i></button>
        </div>
        <div id="student-content"></div>
    </div>

    <!-- === VIEW: EXAM === -->
    <div id="view-exam" class="container hidden">
        <div class="card" style="position:sticky; top:10px; z-index:100; display:flex; justify-content:space-between;">
            <span id="exam-name-display" style="font-weight:bold;">Exam</span>
            <span id="timer" style="color:var(--danger); font-weight:bold; font-family:monospace; font-size:18px;">00:00</span>
        </div>
        <div id="quiz-ui"></div>
        <button class="btn-primary" onclick="app.submitExam()">Submit Exam</button>
    </div>

    <!-- NAV (Student Only) -->
    <div id="nav-bar" class="bottom-nav hidden">
        <i class="fas fa-home nav-icon active" onclick="app.nav('home', this)"></i>
        <i class="fas fa-history nav-icon" onclick="app.nav('history', this)"></i>
        <i class="fas fa-user nav-icon" onclick="app.nav('profile', this)"></i>
    </div>

    <!-- LOGIC -->
    <script type="module">
        // 1. IMPORTS
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // 2. CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBEMPS8vEJztGpoBPJjJIzKKInyt4IY9rQ",
            authDomain: "studentlms-79722.firebaseapp.com",
            projectId: "studentlms-79722",
            storageBucket: "studentlms-79722.firebasestorage.app",
            messagingSenderId: "1029623857004",
            appId: "1:1029623857004:web:fa07cb3de1270990a87d49"
        };

        const CLOUD_URL = "https://api.cloudinary.com/v1_1/dpe74ejhl/image/upload";
        const CLOUD_PRESET = "lms_upload";
        const ADMIN_EMAIL = "rakibk155@gmail.com";

        // 3. INITIALIZE
        let auth, db, user, timerInt;
        let allExams = [];
        let currentExam = null;

        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            // Hide Loader once init is done
            document.getElementById('global-loader').style.display = 'none';
        } catch (e) {
            alert("Firebase Init Failed: " + e.message);
        }

        // 4. HELPERS (Global Access)
        const app = {
            toast: (msg, type='success') => {
                const b = document.getElementById('toast-box');
                const t = document.createElement('div');
                t.className = `toast ${type}`;
                t.innerHTML = msg;
                b.appendChild(t);
                setTimeout(()=>t.remove(), 3000);
            },

            // --- AUTH ---
            login: async () => {
                const e = document.getElementById('email').value;
                const p = document.getElementById('password').value;
                try {
                    await signInWithEmailAndPassword(auth, e, p);
                } catch(err) { app.toast(err.message, 'error'); }
            },
            
            loginGoogle: async () => {
                try {
                    const provider = new GoogleAuthProvider();
                    const res = await signInWithPopup(auth, provider);
                    // Create user doc if new
                    const ref = doc(db, "users", res.user.uid);
                    const snap = await getDoc(ref);
                    if(!snap.exists()) {
                        const role = (res.user.email.toLowerCase() === ADMIN_EMAIL) ? 'admin' : 'student';
                        await setDoc(ref, { email: res.user.email, role });
                    }
                } catch(err) { 
                    app.toast("Google Login Failed. Check Authorized Domains in Firebase Console.", 'error');
                    console.error(err);
                }
            },

            register: async () => {
                const e = document.getElementById('reg-email').value;
                const p = document.getElementById('reg-pass').value;
                if(p.length < 6) return app.toast("Password must be 6+ chars", 'error');
                try {
                    const res = await createUserWithEmailAndPassword(auth, e, p);
                    const role = (e.toLowerCase() === ADMIN_EMAIL) ? 'admin' : 'student';
                    await setDoc(doc(db, "users", res.user.uid), { email: e, role });
                    app.toast("Registered!");
                } catch(err) { app.toast(err.message, 'error'); }
            },

            logout: () => signOut(auth),

            // --- ADMIN ---
            addQField: () => {
                const d = document.createElement('div');
                d.className = 'q-box';
                d.innerHTML = `
                    <input type="text" class="q-txt" placeholder="Question Text">
                    <input type="file" class="q-img" accept="image/*">
                    <input type="text" class="o1" placeholder="Option 1">
                    <input type="text" class="o2" placeholder="Option 2">
                    <select class="cor"><option value="0">Opt 1 Correct</option><option value="1">Opt 2 Correct</option></select>
                    <button class="btn-danger" style="width:auto; margin-top:5px;" onclick="this.parentElement.remove()">Remove</button>
                `;
                document.getElementById('q-builder').appendChild(d);
            },

            saveExam: async () => {
                const btn = document.getElementById('btn-pub');
                const title = document.getElementById('exam-title').value;
                const time = document.getElementById('exam-time').value;
                const qs = document.querySelectorAll('.q-box');

                if(!title || qs.length === 0) return app.toast("Fill details", 'error');
                
                btn.innerText = "Uploading...";
                btn.disabled = true;

                let qList = [];
                for(let q of qs) {
                    const txt = q.querySelector('.q-txt').value;
                    const file = q.querySelector('.q-img').files[0];
                    let url = "";
                    
                    if(file) {
                        const fd = new FormData();
                        fd.append('file', file);
                        fd.append('upload_preset', CLOUD_PRESET);
                        try {
                            const req = await fetch(CLOUD_URL, {method:'POST', body:fd});
                            const res = await req.json();
                            url = res.secure_url;
                        } catch(e) { console.error(e); }
                    }

                    qList.push({
                        text: txt,
                        image: url,
                        options: [q.querySelector('.o1').value, q.querySelector('.o2').value],
                        correct: parseInt(q.querySelector('.cor').value)
                    });
                }

                try {
                    await addDoc(collection(db, "exams"), {
                        title, time: parseInt(time), questions: qList, createdAt: new Date()
                    });
                    app.toast("Published!");
                    setTimeout(()=> location.reload(), 1500);
                } catch(e) { app.toast(e.message, 'error'); btn.disabled=false; }
            },

            deleteExam: async (id) => {
                if(!confirm("Delete?")) return;
                await deleteDoc(doc(db, "exams", id));
                app.loadAdmin();
            },

            // --- STUDENT ---
            nav: (tab, el) => {
                document.querySelectorAll('.nav-icon').forEach(i=>i.classList.remove('active'));
                if(el) el.classList.add('active');
                if(tab === 'home') app.loadStudentHome();
                if(tab === 'history') app.loadHistory();
                if(tab === 'profile') app.loadProfile();
            },

            loadStudentHome: async () => {
                const c = document.getElementById('student-content');
                c.innerHTML = "Loading...";
                const snap = await getDocs(collection(db, "exams"));
                c.innerHTML = "";
                allExams = [];
                snap.forEach(d => {
                    const ex = d.data();
                    allExams.push({id: d.id, ...ex});
                    c.innerHTML += `
                        <div class="card">
                            <h3>${ex.title}</h3>
                            <p>${ex.time} mins | ${ex.questions.length} Questions</p>
                            <button class="btn-primary" onclick="app.startExam('${d.id}')">Start</button>
                        </div>
                    `;
                });
                if(snap.empty) c.innerHTML = "<p>No exams.</p>";
            },

            loadHistory: async () => {
                const c = document.getElementById('student-content');
                c.innerHTML = "<h3>History</h3>";
                const q = query(collection(db, "results"), where("uid", "==", user.uid));
                const snap = await getDocs(q);
                snap.forEach(d => {
                    const r = d.data();
                    c.innerHTML += `<div class="card"><b>${r.examTitle}</b><br>Score: ${r.score}/${r.total}</div>`;
                });
            },

            loadProfile: () => {
                document.getElementById('student-content').innerHTML = `<div class="card" style="text-align:center;"><h3>${user.email}</h3><div class="badge">Student</div></div>`;
            },

            // --- EXAM ENGINE ---
            startExam: (id) => {
                currentExam = allExams.find(e => e.id === id);
                document.getElementById('view-student').classList.add('hidden');
                document.getElementById('nav-bar').classList.add('hidden');
                document.getElementById('view-exam').classList.remove('hidden');
                document.getElementById('exam-name-display').innerText = currentExam.title;

                const ui = document.getElementById('quiz-ui');
                ui.innerHTML = "";
                currentExam.questions.forEach((q, i) => {
                    let img = q.image ? `<img src="${q.image}" style="max-width:100%; border-radius:10px; margin-top:10px;">` : '';
                    ui.innerHTML += `
                        <div class="q-box">
                            <p><b>Q${i+1}</b>: ${q.text}</p>
                            ${img}
                            ${q.options.map((opt, oid) => `
                                <label class="opt-label">
                                    <input type="radio" name="q${i}" value="${oid}">
                                    <span style="margin-left:10px;">${opt}</span>
                                </label>
                            `).join('')}
                        </div>
                    `;
                });

                let time = currentExam.time * 60;
                timerInt = setInterval(() => {
                    let m = Math.floor(time/60);
                    let s = time%60;
                    document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
                    time--;
                    if(time < 0) app.submitExam();
                }, 1000);
            },

            submitExam: async () => {
                clearInterval(timerInt);
                let score = 0;
                currentExam.questions.forEach((q, i) => {
                    const sel = document.querySelector(`input[name="q${i}"]:checked`);
                    if(sel && parseInt(sel.value) === q.correct) score++;
                });

                await addDoc(collection(db, "results"), {
                    uid: user.uid, email: user.email, examTitle: currentExam.title,
                    score, total: currentExam.questions.length, date: new Date()
                });

                alert(`Finished! Score: ${score}/${currentExam.questions.length}`);
                location.reload();
            },

            // --- ADMIN LOAD ---
            loadAdmin: async () => {
                const div = document.getElementById('admin-list');
                const snap = await getDocs(collection(db, "exams"));
                div.innerHTML = "";
                snap.forEach(d => {
                    div.innerHTML += `
                        <div class="card" style="display:flex; justify-content:space-between;">
                            ${d.data().title}
                            <button class="btn-danger" style="width:auto; padding:5px 10px;" onclick="app.deleteExam('${d.id}')">Del</button>
                        </div>
                    `;
                });
            }
        };

        // 5. EXPOSE TO WINDOW
        window.app = app;

        // 6. AUTH STATE LISTENER
        onAuthStateChanged(auth, async (u) => {
            user = u;
            document.querySelectorAll('.container').forEach(e => e.classList.add('hidden'));
            
            if (user) {
                // Determine Role
                let role = 'student';
                if(user.email.toLowerCase() === ADMIN_EMAIL) role = 'admin';
                else {
                    const snap = await getDoc(doc(db, "users", user.uid));
                    if(snap.exists()) role = snap.data().role;
                }

                if(role === 'admin') {
                    document.getElementById('view-admin').classList.remove('hidden');
                    app.loadAdmin();
                } else {
                    document.getElementById('view-student').classList.remove('hidden');
                    document.getElementById('nav-bar').classList.remove('hidden');
                    app.loadStudentHome();
                }
            } else {
                document.getElementById('view-auth').classList.remove('hidden');
                document.getElementById('nav-bar').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
