<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Science Exam Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 select-none">

    <!-- Login -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="card w-full max-w-sm p-8 text-center animate-enter">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold mb-4">S</div>
            <h1 class="text-2xl font-bold mb-2">Student Portal</h1>
            <p class="text-sm text-slate-400 mb-6">Login to access assessments</p>
            <button id="google-btn" class="w-full btn btn-primary">Continue with Google</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-section" class="hidden min-h-screen pb-20">
        <div class="bg-white border-b px-4 py-3 flex justify-between items-center sticky top-0 z-30">
            <div class="flex items-center gap-3">
                <img id="u-img" class="w-9 h-9 rounded-full bg-slate-200">
                <div><h3 id="u-name" class="font-bold text-sm">Student</h3></div>
            </div>
            <button id="logout-btn" class="text-slate-400 hover:text-red-500"><i class="fas fa-power-off"></i></button>
        </div>
        <div class="max-w-4xl mx-auto p-4 space-y-6">
            <h2 class="font-bold text-lg text-slate-700">Available Exams</h2>
            <div id="exam-list" class="grid gap-3"></div>
            <h2 class="font-bold text-lg text-slate-700 mt-6">Attempt History</h2>
            <div id="result-list" class="grid gap-3"></div>
        </div>
    </div>

    <!-- CBT RUNNER -->
    <div id="exam-runner" class="hidden fixed inset-0 z-50 bg-white flex flex-col h-full">
        <div class="h-14 bg-white border-b flex justify-between items-center px-4 flex-shrink-0 shadow-sm z-10">
            <h3 id="run-title" class="font-bold text-sm truncate w-1/3">Exam</h3>
            <div class="flex items-center gap-2 bg-slate-100 px-3 py-1 rounded-lg">
                <i class="fas fa-clock text-indigo-600"></i>
                <span id="timer" class="font-mono font-bold text-lg text-slate-800">00:00</span>
            </div>
            <div class="flex gap-2">
                <button onclick="showQP()" class="p-2 bg-slate-100 rounded text-xs font-bold md:block hidden">📄 QP</button>
                <button onclick="togglePalette()" class="text-slate-600 md:hidden"><i class="fas fa-th text-xl"></i></button>
            </div>
        </div>

        <div class="flex-grow flex overflow-hidden relative">
            <!-- Question Area -->
            <div class="flex-grow flex flex-col h-full w-full md:w-3/4">
                <div id="question-area" class="flex-grow overflow-y-auto p-6">
                    <div id="native-q-display" class="hidden">
                        <div class="flex justify-between mb-4 border-b pb-2">
                            <span class="text-xs font-bold text-white bg-indigo-600 px-2 py-1 rounded">Question <span id="q-curr-num">1</span></span>
                            <span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded border border-green-200">+<span id="q-pos">4</span> / <span class="text-red-500">-<span id="q-neg">1</span></span></span>
                        </div>
                        <div id="q-img-box" class="q-img-box hidden"></div>
                        <p id="q-text" class="text-lg font-medium text-slate-800 mb-6 leading-relaxed"></p>
                        <div id="q-options" class="space-y-3"></div>
                    </div>
                    <div id="pdf-display" class="hidden h-full"><iframe id="exam-pdf" class="w-full h-full border-0"></iframe></div>
                </div>

                <div class="h-16 border-t bg-slate-50 flex items-center justify-between px-6 flex-shrink-0">
                    <div class="flex gap-2">
                        <button onclick="changeQ(-1)" class="btn btn-outline text-xs">Prev</button>
                        <button onclick="changeQ(1)" class="btn btn-primary text-xs">Next</button>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="markReview()" class="btn btn-outline text-amber-500 border-amber-200 text-xs">Review</button>
                        <button onclick="submitExamCheck()" class="btn btn-danger text-xs">Submit</button>
                    </div>
                </div>
            </div>

            <!-- Palette Sidebar -->
            <div id="exam-sidebar" class="exam-sidebar w-full md:w-1/4 bg-white border-l flex flex-col h-full absolute md:relative right-0 top-0">
                <div class="p-4 border-b flex justify-between md:hidden"><h3 class="font-bold">Palette</h3><button onclick="togglePalette()">&times;</button></div>
                <div class="p-4 grid grid-cols-2 gap-2 text-[10px] font-bold text-slate-500 border-b bg-slate-50">
                    <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-green-500"></span> Answered</div>
                    <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-500"></span> Review</div>
                    <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-red-500"></span> Skipped</div>
                    <div class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-white border"></span> Visit</div>
                </div>
                <div id="palette-grid" class="flex-grow overflow-y-auto p-4 p-grid content-start"></div>
            </div>
        </div>
    </div>

    <!-- Analysis Modal -->
    <div id="result-modal" class="hidden fixed inset-0 z-[60] bg-black/90 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-4xl h-[90vh] rounded-2xl flex flex-col overflow-hidden relative">
            <button onclick="document.getElementById('result-modal').classList.add('hidden')" class="absolute top-4 right-4 text-2xl z-20 hover:text-red-500">&times;</button>
            <div class="p-6 border-b bg-slate-50 flex justify-center gap-10 text-center">
                <div><p class="text-xs font-bold text-slate-400">SCORE</p><h1 id="res-score" class="text-4xl font-bold text-indigo-600">0</h1></div>
                <div><p class="text-xs font-bold text-slate-400">ACCURACY</p><h1 id="res-acc" class="text-4xl font-bold text-green-600">0%</h1></div>
            </div>
            <div class="flex-grow overflow-y-auto p-6 grid md:grid-cols-2 gap-6">
                <div class="h-64 flex items-center justify-center"><canvas id="res-chart"></canvas></div>
                <div id="res-details" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>function togglePalette(){ document.getElementById('exam-sidebar').classList.toggle('open'); }</script>
</body>
</html>
