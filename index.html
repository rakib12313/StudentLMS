<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NeonLMS - Ultimate Exam System</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* --- THEME VARIABLES --- */
        :root {
            --primary: #7000ff;
            --primary-glow: #bd00ff;
            --secondary: #00f7ff;
            --bg-dark: #050505;
            --glass-bg: rgba(20, 20, 25, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --success: #00ff9d;
            --danger: #ff0055;
            --card-radius: 24px;
        }

        /* --- GLOBAL RESET --- */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(112, 0, 255, 0.2) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 247, 255, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* --- UTILITIES --- */
        .hidden { display: none !important; }
        .flex-center { display: flex; justify-content: center; align-items: center; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }

        /* --- ANIMATIONS --- */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 10px var(--primary-glow); } 50% { box-shadow: 0 0 25px var(--primary-glow); } 100% { box-shadow: 0 0 10px var(--primary-glow); } }
        @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* --- UI COMPONENTS --- */
        
        /* Glass Card */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        
        /* Typography */
        h1, h2, h3 { margin: 0 0 15px 0; font-weight: 700; }
        .gradient-text {
            background: linear-gradient(135deg, #fff 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Forms */
        input, select, textarea {
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 16px;
            transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 15px rgba(112, 0, 255, 0.2); }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-glow)); color: white; box-shadow: 0 4px 15px rgba(112, 0, 255, 0.3); }
        .btn-primary:active { transform: scale(0.98); }
        .btn-secondary { background: rgba(255,255,255,0.1); color: white; }
        .btn-danger { background: rgba(255, 0, 85, 0.2); color: var(--danger); border: 1px solid var(--danger); }
        .btn-google { background: #fff; color: #333; }

        /* --- TOAST NOTIFICATION --- */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .toast {
            background: rgba(20, 20, 30, 0.95);
            border-left: 4px solid var(--primary);
            padding: 15px 25px;
            margin-bottom: 10px;
            border-radius: 8px;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 10px;
            animation: slideInRight 0.3s;
        }
        .toast.success { border-color: var(--success); }
        .toast.error { border-color: var(--danger); }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px;
            background: rgba(30, 30, 40, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .nav-item {
            color: var(--text-muted); font-size: 20px; padding: 10px;
            border-radius: 50%; transition: 0.3s;
            position: relative;
        }
        .nav-item.active { color: white; background: var(--primary); transform: translateY(-5px); box-shadow: 0 5px 15px rgba(112, 0, 255, 0.4); }

        /* --- EXAM SPECIFIC --- */
        .exam-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 20px; }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; background: rgba(255,255,255,0.1); }
        .badge-blue { background: rgba(0, 247, 255, 0.2); color: var(--secondary); }
        
        .question-box {
            background: rgba(255,255,255,0.03);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            transition: 0.3s;
        }
        .question-box:hover { border-color: var(--glass-border); background: rgba(255,255,255,0.05); }

        /* Radio Custom */
        .option-label {
            display: flex; align-items: center;
            padding: 12px; margin: 8px 0;
            border-radius: 10px;
            background: rgba(0,0,0,0.2);
            cursor: pointer; transition: 0.2s;
            border: 1px solid transparent;
        }
        .option-label:hover { background: rgba(255,255,255,0.1); }
        input[type="radio"]:checked + .option-label { border-color: var(--primary); background: rgba(112, 0, 255, 0.1); }
        input[type="radio"] { display: none; }

        /* Loader */
        .loader-box { display: flex; justify-content: center; padding: 40px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top-color: var(--secondary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Admin Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; text-align: center; }
        .stat-val { font-size: 24px; font-weight: bold; color: var(--secondary); }
        .stat-label { font-size: 12px; color: var(--text-muted); }

    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- === VIEW: AUTH === -->
    <div id="view-auth" class="flex-center" style="min-height: 100vh;">
        <div class="card" style="width: 100%; max-width: 380px; text-align: center;">
            <div style="width: 80px; height: 80px; background: rgba(112,0,255,0.2); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-atom" style="font-size: 40px; color: var(--secondary);"></i>
            </div>
            <h1 class="gradient-text">NeonLMS</h1>
            <p style="color: var(--text-muted); margin-bottom: 30px;">Next Gen Examination Portal</p>
            
            <div id="auth-forms">
                <input type="email" id="email" placeholder="Email Address">
                <input type="password" id="password" placeholder="Password">
                
                <button id="btn-login" class="btn btn-primary" onclick="handleLogin()">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <div style="height: 15px;"></div>
                <button id="btn-google" class="btn btn-google" onclick="handleGoogleLogin()">
                    <i class="fab fa-google"></i> Continue with Google
                </button>
            </div>

            <div id="reg-actions" class="hidden">
                <button class="btn btn-primary" onclick="handleRegister()">Create Account</button>
            </div>

            <p style="margin-top: 25px; font-size: 14px; color: var(--text-muted);">
                <span id="toggle-text">New here?</span> 
                <a href="#" style="color: var(--secondary); text-decoration: none; font-weight: bold;" onclick="toggleAuthMode()">Create Account</a>
            </p>
        </div>
    </div>

    <!-- === VIEW: ADMIN DASHBOARD === -->
    <div id="view-admin" class="container hidden">
        <div class="card" style="border: 1px solid var(--primary);">
            <div class="exam-header" style="border:none; margin:0;">
                <div>
                    <h2 class="gradient-text">Admin Command</h2>
                    <p style="font-size:12px; color:var(--text-muted); margin:0;">Logged as Super Admin</p>
                </div>
                <button onclick="doLogout()" class="btn btn-danger" style="width:auto; padding: 10px 15px;"><i class="fas fa-power-off"></i></button>
            </div>
        </div>

        <!-- Create Exam -->
        <div class="card">
            <h3><i class="fas fa-plus-circle" style="color: var(--success);"></i> Create New Exam</h3>
            <input type="text" id="new-exam-title" placeholder="Exam Title (e.g., Physics Final)">
            <input type="number" id="new-exam-time" placeholder="Duration in Minutes">
            
            <div id="builder-questions"></div>

            <button class="btn btn-secondary" onclick="addQuestionField()" style="border: 1px dashed var(--text-muted);">
                <i class="fas fa-plus"></i> Add Question
            </button>
            <div style="height: 15px;"></div>
            <button onclick="saveExam()" id="btn-save-exam" class="btn btn-primary">
                <i class="fas fa-cloud-upload-alt"></i> Publish Exam
            </button>
        </div>

        <!-- Manage Exams -->
        <h3 style="margin-left: 10px;">Manage Exams</h3>
        <div id="admin-exam-list">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- === VIEW: STUDENT DASHBOARD === -->
    
    <!-- Tab 1: Home (Exam List) -->
    <div id="view-student-home" class="container hidden">
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
            <div>
                <h2 style="margin:0;">Hello, Scholar 👋</h2>
                <p style="margin:0; font-size:13px; color:var(--text-muted);">Ready to test your skills?</p>
            </div>
            <div style="width: 40px; height: 40px; background: var(--glass-bg); border-radius: 50%; display:flex; align-items:center; justify-content:center;">
                <i class="fas fa-user" style="color: var(--secondary);"></i>
            </div>
        </div>

        <h3 style="margin-left: 10px; margin-bottom: 15px;">Available Exams</h3>
        <div id="exam-list"></div>
    </div>

    <!-- Tab 2: History -->
    <div id="view-student-history" class="container hidden">
        <h2 style="margin-left: 10px;">Your Performance</h2>
        <div id="history-list"></div>
    </div>

    <!-- Tab 3: Profile -->
    <div id="view-student-profile" class="container hidden">
        <div class="card" style="text-align: center; padding-top: 40px;">
            <div style="width: 100px; height: 100px; background: linear-gradient(45deg, var(--primary), var(--secondary)); border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: white;">
                <i class="fas fa-user-astronaut"></i>
            </div>
            <h2 id="profile-email">user@email.com</h2>
            <div class="badge badge-blue" style="display:inline-block;">Student Account</div>

            <div class="stats-grid" style="margin-top: 30px;">
                <div class="stat-card">
                    <div class="stat-val" id="stat-taken">0</div>
                    <div class="stat-label">Exams Taken</div>
                </div>
                <div class="stat-card">
                    <div class="stat-val" id="stat-avg">0%</div>
                    <div class="stat-label">Avg Score</div>
                </div>
            </div>

            <button onclick="doLogout()" class="btn btn-danger" style="margin-top: 20px;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>

    <!-- === VIEW: TAKING EXAM === -->
    <div id="view-taking-exam" class="container hidden" style="padding-bottom: 20px;">
        <div class="card" style="position: sticky; top: 10px; z-index: 900; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--secondary);">
            <span style="font-weight: bold;" id="active-exam-name">Exam Name</span>
            <div class="badge badge-blue" style="font-size: 16px;">
                <i class="far fa-clock"></i> <span id="timer-display">00:00</span>
            </div>
        </div>
        
        <div id="quiz-area"></div>
        
        <button onclick="submitExam()" class="btn btn-primary" style="background: var(--success); color: black;">
            <i class="fas fa-check-circle"></i> Submit Answers
        </button>
    </div>

    <!-- === BOTTOM NAVIGATION === -->
    <div id="bottom-nav" class="bottom-nav hidden">
        <div class="nav-item active" onclick="switchStudentTab('home', this)">
            <i class="fas fa-home"></i>
        </div>
        <div class="nav-item" onclick="switchStudentTab('history', this)">
            <i class="fas fa-history"></i>
        </div>
        <div class="nav-item" onclick="switchStudentTab('profile', this)">
            <i class="fas fa-user"></i>
        </div>
    </div>

    <!-- === JAVASCRIPT === -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, deleteDoc, query, where, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // --- CREDENTIALS ---
        const firebaseConfig = {
            apiKey: "AIzaSyBEMPS8vEJztGpoBPJjJIzKKInyt4IY9rQ",
            authDomain: "studentlms-79722.firebaseapp.com",
            projectId: "studentlms-79722",
            storageBucket: "studentlms-79722.firebasestorage.app",
            messagingSenderId: "1029623857004",
            appId: "1:1029623857004:web:fa07cb3de1270990a87d49"
        };
        const CLOUD_URL = "https://api.cloudinary.com/v1_1/dpe74ejhl/image/upload";
        const CLOUD_PRESET = "lms_upload";
        const ADMIN_EMAIL = "rakibk155@gmail.com";

        // --- INIT ---
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let currentExamData = null;
        let timerInterval = null;

        // --- UI HELPERS ---
        window.showToast = (msg, type = 'success') => {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas fa-${type === 'success' ? 'check-circle' : 'exclamation-triangle'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        };

        window.toggleAuthMode = () => {
            const regMode = document.getElementById('reg-actions').classList.contains('hidden');
            if (regMode) {
                document.getElementById('reg-actions').classList.remove('hidden');
                document.getElementById('auth-forms').querySelector('button').classList.add('hidden'); // hide login btn
                document.getElementById('btn-google').classList.add('hidden');
                document.getElementById('toggle-text').innerText = "Have an account?";
            } else {
                document.getElementById('reg-actions').classList.add('hidden');
                document.getElementById('auth-forms').querySelector('button').classList.remove('hidden');
                document.getElementById('btn-google').classList.remove('hidden');
                document.getElementById('toggle-text').innerText = "New here?";
            }
        };

        // --- AUTH LOGIC ---
        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                showToast("Welcome back!", "success");
            } catch(e) { showToast(e.message, "error"); }
        };

        window.handleRegister = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value;
            if(pass.length < 6) return showToast("Password too short (min 6)", "error");

            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                const role = (email.toLowerCase() === ADMIN_EMAIL) ? 'admin' : 'student';
                await setDoc(doc(db, "users", res.user.uid), { email, role });
                showToast(`Account created as ${role}`, "success");
            } catch(e) { showToast(e.message, "error"); }
        };

        window.handleGoogleLogin = async () => {
            try {
                const res = await signInWithPopup(auth, googleProvider);
                const userDoc = await getDoc(doc(db, "users", res.user.uid));
                if (!userDoc.exists()) {
                    const role = (res.user.email.toLowerCase() === ADMIN_EMAIL) ? 'admin' : 'student';
                    await setDoc(doc(db, "users", res.user.uid), { email: res.user.email, role });
                }
                showToast("Logged in with Google", "success");
            } catch(e) { showToast(e.message, "error"); }
        };

        window.doLogout = () => {
            signOut(auth);
            showToast("Logged out successfully", "success");
        };

        // --- ROUTING & NAVIGATION ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                let role = 'student';
                
                // Security Check
                if (user.email.toLowerCase() === ADMIN_EMAIL) {
                    role = 'admin';
                } else {
                    const snap = await getDoc(doc(db, "users", user.uid));
                    if(snap.exists()) role = snap.data().role;
                    if(user.email.toLowerCase() === ADMIN_EMAIL) role = 'admin'; // Override
                }

                document.getElementById('view-auth').classList.add('hidden');

                if (role === 'admin') {
                    document.getElementById('view-admin').classList.remove('hidden');
                    loadAdminExamList();
                } else {
                    document.getElementById('bottom-nav').classList.remove('hidden');
                    switchStudentTab('home');
                }
            } else {
                currentUser = null;
                // Hide all views, show auth
                document.querySelectorAll('.container').forEach(el => el.classList.add('hidden'));
                document.getElementById('bottom-nav').classList.add('hidden');
                document.getElementById('view-auth').classList.remove('hidden');
            }
        });

        window.switchStudentTab = (tab, el) => {
            // UI Switch
            ['view-student-home', 'view-student-history', 'view-student-profile'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(`view-student-${tab}`).classList.remove('hidden');
            
            // Nav Active State
            if(el) {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                el.classList.add('active');
            } else {
                // Default home active
                document.querySelectorAll('.nav-item')[0].classList.add('active');
            }

            // Data Load
            if(tab === 'home') loadExams();
            if(tab === 'history') loadHistory();
            if(tab === 'profile') loadProfile();
        };

        // --- ADMIN FEATURES ---
        let qCount = 0;
        window.addQuestionField = () => {
            qCount++;
            const container = document.getElementById('builder-questions');
            const div = document.createElement('div');
            div.className = 'question-box';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <h4 style="margin:0;">Q${qCount}</h4>
                    <i class="fas fa-trash" style="color:var(--danger); cursor:pointer;" onclick="this.parentElement.parentElement.remove()"></i>
                </div>
                <input type="text" class="q-txt" placeholder="Question Text" style="margin-top:10px;">
                <input type="file" class="q-img" accept="image/*">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                    <input type="text" class="opt1" placeholder="Option 1">
                    <input type="text" class="opt2" placeholder="Option 2">
                    <input type="text" class="opt3" placeholder="Option 3">
                    <input type="text" class="opt4" placeholder="Option 4">
                </div>
                <select class="q-correct" style="margin-top:10px;">
                    <option value="0">Option 1 Correct</option>
                    <option value="1">Option 2 Correct</option>
                    <option value="2">Option 3 Correct</option>
                    <option value="3">Option 4 Correct</option>
                </select>
            `;
            container.appendChild(div);
        };

        window.saveExam = async () => {
            const btn = document.getElementById('btn-save-exam');
            const title = document.getElementById('new-exam-title').value;
            const time = document.getElementById('new-exam-time').value;
            const qBlocks = document.querySelectorAll('.question-box');

            if(!title || qBlocks.length === 0) return showToast("Fill details & add questions", "error");

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Uploading...';
            btn.disabled = true;
            let qData = [];

            for(let block of qBlocks) {
                const text = block.querySelector('.q-txt').value;
                const fileIn = block.querySelector('.q-img');
                const correct =
