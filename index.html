<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 select-none" oncontextmenu="return false;"> <!-- Piracy Protection -->

    <!-- Login -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass-panel w-full max-w-sm p-8 text-center rounded-3xl animate-enter">
            <h1 class="text-3xl font-bold mb-2">Welcome Back</h1>
            <p class="text-sm opacity-60 mb-8">Access your personalized dashboard</p>
            <button id="google-btn" class="w-full bg-white border border-slate-200 py-4 rounded-xl font-bold text-sm flex items-center justify-center gap-3 shadow-sm active:scale-95 transition">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> 
                Continue with Google
            </button>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-section" class="hidden min-h-screen">
        <!-- Top Bar -->
        <div class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-100 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img id="nav-photo" class="w-9 h-9 rounded-full bg-slate-200 object-cover">
                <div><h3 id="nav-name" class="text-sm font-bold">Student</h3><span id="nav-batch" class="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full">...</span></div>
            </div>
            <div class="flex gap-2">
                 <button onclick="toggleTheme()" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center"><i class="fas fa-moon"></i></button>
                 <button onclick="document.getElementById('leaderboard-modal').classList.remove('hidden'); loadLeaderboard()" class="w-9 h-9 rounded-full bg-yellow-50 text-yellow-600 flex items-center justify-center"><i class="fas fa-trophy"></i></button>
            </div>
        </div>

        <div class="max-w-2xl mx-auto px-4 pt-4 pb-24">
            <!-- Live & Notice -->
            <div id="live-banner" class="hidden mb-4 bg-red-500 rounded-xl p-3 text-white flex justify-between items-center animate-pulse">
                <div class="flex items-center gap-2"><span class="w-2 h-2 bg-white rounded-full animate-ping"></span><span class="font-bold text-xs">LIVE CLASS NOW</span></div>
                <a id="live-btn" target="_blank" class="bg-white text-red-600 px-3 py-1 rounded-lg text-[10px] font-bold">JOIN</a>
            </div>
            <div id="notice-box" class="hidden mb-6 bg-indigo-600 rounded-xl p-4 text-white shadow-lg"><p class="text-[10px] opacity-70 mb-1">NOTICE</p><p id="notice-text" class="text-xs font-bold">...</p></div>

            <!-- Views -->
            <div id="view-home" class="animate-enter space-y-4">
                <div class="tab-scroll">
                    <button onclick="filterType('note')" class="tab-btn active-tab">Notes</button>
                    <button onclick="filterType('video')" class="tab-btn inactive-tab">Videos</button>
                    <button onclick="filterType('flashcard')" class="tab-btn inactive-tab">Cards</button>
                </div>
                <input id="search-bar" onkeyup="searchContent()" placeholder="Search topics..." class="w-full p-3 rounded-xl border-none shadow-sm text-sm">
                <div id="content-grid" class="grid gap-3"></div>
            </div>

            <div id="view-exams" class="hidden animate-enter space-y-4">
                <h2 class="font-bold text-lg">Exams</h2>
                <div id="exams-grid" class="grid gap-3"></div>
            </div>

            <div id="view-tasks" class="hidden animate-enter space-y-4">
                <h2 class="font-bold text-lg">Homework & Tasks</h2>
                <div class="glass-card p-4">
                    <div class="flex gap-2 mb-2"><input id="new-task" placeholder="Add personal task..." class="flex-grow p-2 border rounded text-xs"><button onclick="addTask()" class="bg-indigo-600 text-white px-3 rounded text-xl">+</button></div>
                    <div id="task-list" class="space-y-2"></div>
                </div>
                <div id="hw-list" class="space-y-2"></div>
            </div>

            <div id="view-forum" class="hidden animate-enter h-[70vh] flex flex-col">
                <h2 class="font-bold text-lg mb-2">Community Forum</h2>
                <div id="chat-box" class="flex-grow overflow-y-auto bg-slate-100 rounded-xl p-3 mb-2 space-y-2"></div>
                <div class="flex gap-2"><input id="chat-in" placeholder="Ask a doubt..." class="flex-grow p-3 rounded-xl border-none shadow-sm"><button onclick="sendChat()" class="bg-indigo-600 text-white w-12 rounded-xl"><i class="fas fa-paper-plane"></i></button></div>
            </div>

            <div id="view-profile" class="hidden animate-enter">
                <div class="glass-card p-6 text-center">
                    <img id="profile-lg" class="w-20 h-20 mx-auto rounded-full mb-2 bg-slate-200 object-cover">
                    <h2 id="p-name" class="font-bold text-lg">User</h2>
                    <div class="grid grid-cols-3 gap-2 my-4">
                        <div class="bg-indigo-50 p-2 rounded-xl"><p id="xp-stat" class="font-bold text-indigo-600">0</p><p class="text-[10px]">XP</p></div>
                        <div class="bg-green-50 p-2 rounded-xl"><p id="streak-stat" class="font-bold text-green-600">0</p><p class="text-[10px]">Streak</p></div>
                        <div class="bg-orange-50 p-2 rounded-xl"><p class="font-bold text-orange-600">1</p><p class="text-[10px]">Level</p></div>
                    </div>
                    <div id="attendance-grid" class="grid grid-cols-7 gap-1"></div>
                    <button id="logout-btn" class="mt-6 w-full py-2 bg-red-50 text-red-600 font-bold rounded-xl text-sm">Sign Out</button>
                </div>
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="fixed bottom-0 w-full bg-white/95 backdrop-blur border-t py-2 flex justify-around z-50">
            <button onclick="setTab('home')" id="btn-home" class="flex flex-col items-center text-indigo-600"><i class="fas fa-home text-xl"></i><span class="text-[9px]">Home</span></button>
            <button onclick="setTab('exams')" id="btn-exams" class="flex flex-col items-center text-slate-400"><i class="fas fa-file-contract text-xl"></i><span class="text-[9px]">Exams</span></button>
            <button onclick="setTab('tasks')" id="btn-tasks" class="flex flex-col items-center text-slate-400"><i class="fas fa-check-square text-xl"></i><span class="text-[9px]">Tasks</span></button>
            <button onclick="setTab('forum')" id="btn-forum" class="flex flex-col items-center text-slate-400"><i class="fas fa-comments text-xl"></i><span class="text-[9px]">Forum</span></button>
            <button onclick="setTab('profile')" id="btn-profile" class="flex flex-col items-center text-slate-400"><i class="fas fa-user text-xl"></i><span class="text-[9px]">Profile</span></button>
        </div>
    </div>

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="hidden fixed inset-0 z-[60] bg-black/80 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 animate-enter relative">
            <button onclick="document.getElementById('leaderboard-modal').classList.add('hidden')" class="absolute top-2 right-2 text-xl">&times;</button>
            <h3 class="font-bold text-center mb-4 text-yellow-600"><i class="fas fa-crown"></i> Top Students</h3>
            <div id="lb-list" class="space-y-2 max-h-60 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Viewer Modal with Watermark -->
    <div id="viewer-modal" class="hidden fixed inset-0 z-[100] bg-black flex flex-col">
        <button onclick="document.getElementById('viewer-modal').classList.add('hidden')" class="absolute top-4 right-4 text-white text-3xl z-[60]">&times;</button>
        <div id="watermark-layer" class="watermark"></div> <!-- Piracy Protection -->
        <iframe id="pdf-frame" class="w-full h-full border-none relative z-10"></iframe>
    </div>

    <!-- Exam Runner -->
    <div id="exam-runner" class="hidden fixed inset-0 z-[100] bg-white flex flex-col">
        <div class="p-3 bg-slate-900 text-white flex justify-between items-center shadow-md">
            <span class="font-bold text-sm"><i class="fas fa-clock text-red-500"></i> <span id="timer">00:00</span></span>
            <button onclick="finishExam()" class="bg-indigo-600 px-3 py-1 rounded text-xs font-bold">Submit</button>
        </div>
        <div class="flex-grow flex flex-col lg:flex-row h-full overflow-hidden">
            <iframe id="exam-pdf" class="w-full lg:w-1/2 h-1/2 lg:h-full bg-slate-100"></iframe>
            <div id="exam-qs" class="w-full lg:w-1/2 h-full flex-grow overflow-y-auto p-4 space-y-4 pb-20 bg-white"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        window.setTab = (t) => {
            ['home','exams','tasks','forum','profile'].forEach(x => {
                document.getElementById('view-'+x).classList.add('hidden');
                document.getElementById('btn-'+x).classList.remove('text-indigo-600');
                document.getElementById('btn-'+x).classList.add('text-slate-400');
            });
            document.getElementById('view-'+t).classList.remove('hidden');
            document.getElementById('btn-'+t).classList.add('text-indigo-600');
            document.getElementById('btn-'+t).classList.remove('text-slate-400');
        };
        window.toggleTheme = () => document.body.classList.toggle('dark');
    </script>
</body>
</html>
