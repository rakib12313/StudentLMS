<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student LMS Exam System</title>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- CSS STYLES --- */
        :root {
            --primary: #6C63FF;
            --accent: #00d4ff;
            --bg-grad: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-grad);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 100px; /* Space for bottom nav */
        }

        /* Utils */
        .hidden { display: none !important; }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .center-flex { display: flex; justify-content: center; align-items: center; min-height: 80vh; }

        /* Glass Cards */
        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Inputs & Buttons */
        h2, h3 { margin-top: 0; font-weight: 300; letter-spacing: 1px; }
        
        input, select {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            box-sizing: border-box;
            outline: none;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(108, 99, 255, 0.4);
        }

        button:active { transform: scale(0.98); }
        button.secondary { background: rgba(255,255,255,0.1); }
        button.google-btn { background: #db4437; }
        button.danger { background: #ff4444; width: auto; padding: 8px 15px; font-size: 14px; }

        /* --- GLASSY BOTTOM NAV --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            height: 70px;
            background: rgba(20, 20, 40, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .nav-item {
            color: rgba(255,255,255,0.5);
            text-align: center;
            font-size: 12px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .nav-item i { font-size: 20px; margin-bottom: 2px; }
        .nav-item.active { color: var(--accent); transform: translateY(-5px); }
        .nav-item.active i { text-shadow: 0 0 10px var(--accent); }

        /* Specific Views */
        .question-block {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 3px solid var(--accent);
        }

        .exam-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: #aaa;
        }

        img.preview { max-width: 100%; border-radius: 10px; margin-top: 10px; }
        
        /* Loading Spinner */
        .loader {
            border: 4px solid rgba(255,255,255,0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Responsive */
        @media (min-width: 768px) {
            .container { padding-top: 50px; }
            .bottom-nav { bottom: 30px; width: 400px; }
        }
    </style>
</head>
<body>

    <!-- === VIEW: LOGIN === -->
    <div id="view-auth" class="center-flex">
        <div class="glass-card" style="width: 100%; max-width: 350px; text-align: center;">
            <i class="fas fa-graduation-cap" style="font-size: 50px; color: var(--accent); margin-bottom: 20px;"></i>
            <h2 id="auth-title">Student LMS Login</h2>
            
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            
            <button id="btn-login" onclick="handleLogin()">Login</button>
            <button id="btn-google" class="google-btn" onclick="handleGoogleLogin()"><i class="fab fa-google"></i> Google Login</button>
            
            <div id="reg-fields" class="hidden">
                <select id="role">
                    <option value="student">Student</option>
                    <option value="admin">Admin</option>
                </select>
                <button class="secondary" onclick="handleRegister()">Create Account</button>
            </div>

            <p style="margin-top: 20px; font-size: 14px;">
                <span id="toggle-text">New user?</span> 
                <a href="#" style="color: var(--accent);" onclick="toggleAuthMode()">Click here</a>
            </p>
        </div>
    </div>

    <!-- === VIEW: ADMIN DASHBOARD === -->
    <div id="view-admin" class="container hidden">
        <div class="glass-card">
            <div class="exam-meta">
                <h2><i class="fas fa-user-shield"></i> Admin Panel</h2>
                <button class="danger" onclick="doLogout()">Logout</button>
            </div>
            <h3>Create New Exam</h3>
            <input type="text" id="new-exam-title" placeholder="Exam Subject / Title">
            <input type="number" id="new-exam-time" placeholder="Duration (Minutes)">
            <hr style="border-color: var(--glass-border); margin: 20px 0;">
            
            <div id="builder-questions"></div>

            <button class="secondary" onclick="addQuestionField()"><i class="fas fa-plus"></i> Add Question</button>
            <button onclick="saveExam()" id="btn-save-exam" style="background: var(--accent); margin-top: 20px;">Publish Exam</button>
        </div>
    </div>

    <!-- === VIEW: STUDENT HOME === -->
    <div id="view-student" class="container hidden">
        <div class="glass-card" style="display:flex; justify-content:space-between; align-items:center;">
            <h2><i class="fas fa-user-graduate"></i> Available Exams</h2>
            <button class="danger" onclick="doLogout()">Logout</button>
        </div>
        <div id="exam-list">
            <!-- Exams load here -->
            <div class="loader"></div>
        </div>
    </div>

    <!-- === VIEW: TAKING EXAM === -->
    <div id="view-taking-exam" class="container hidden">
        <div class="glass-card sticky-header" style="position:sticky; top:10px; z-index:900; background: rgba(15, 12, 41, 0.95); border-bottom: 2px solid var(--accent);">
            <div style="display: flex; justify-content: space-between;">
                <h3 id="active-exam-name">Exam</h3>
                <h3 style="color: var(--accent);" id="timer-display">00:00</h3>
            </div>
        </div>
        <div id="quiz-area" style="margin-top: 20px;"></div>
        <div class="glass-card">
            <button onclick="submitExam()" style="background: #00c851;">Submit Answers</button>
        </div>
    </div>

    <!-- === GLASSY BOTTOM NAV (Hidden on login) === -->
    <div id="bottom-nav" class="bottom-nav hidden">
        <div class="nav-item active" onclick="navTo('home')">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="navTo('profile')">
            <i class="fas fa-user"></i>
            <span>Profile</span>
        </div>
        <div class="nav-item" onclick="doLogout()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
        </div>
    </div>

    <!-- === JAVASCRIPT === -->
    <script type="module">
        // --- CONFIGURATION ---
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // YOUR SPECIFIC CREDENTIALS
        const firebaseConfig = {
            apiKey: "AIzaSyBEMPS8vEJztGpoBPJjJIzKKInyt4IY9rQ",
            authDomain: "studentlms-79722.firebaseapp.com",
            projectId: "studentlms-79722",
            storageBucket: "studentlms-79722.firebasestorage.app",
            messagingSenderId: "1029623857004",
            appId: "1:1029623857004:web:fa07cb3de1270990a87d49"
        };

        // YOUR CLOUDINARY CREDENTIALS
        const CLOUD_NAME = "dpe74ejhl"; 
        const CLOUD_PRESET = "lms_upload"; 
        const CLOUD_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

        // Initialize
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        let currentUser = null;
        let currentExamData = null;
        let timerInterval = null;

        // --- GLOBAL FUNCTIONS (Attached to Window for HTML access) ---

        // 1. Auth Logic
        window.toggleAuthMode = () => {
            const regFields = document.getElementById('reg-fields');
            const isHidden = regFields.classList.contains('hidden');
            const title = document.getElementById('auth-title');
            const toggleText = document.getElementById('toggle-text');
            
            if(isHidden) {
                regFields.classList.remove('hidden');
                document.getElementById('btn-login').classList.add('hidden');
                document.getElementById('btn-google').classList.add('hidden');
                title.innerText = "Register Account";
                toggleText.innerText = "Have an account?";
            } else {
                regFields.classList.add('hidden');
                document.getElementById('btn-login').classList.remove('hidden');
                document.getElementById('btn-google').classList.remove('hidden');
                title.innerText = "Student Login";
                toggleText.innerText = "New user?";
            }
        };

        window.handleRegister = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            try {
                const res = await createUserWithEmailAndPassword(auth, email, pass);
                await setDoc(doc(db, "users", res.user.uid), { email, role });
                alert("Account created! You are logged in.");
            } catch(e) { alert(e.message); }
        };

        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try { await signInWithEmailAndPassword(auth, email, pass); } 
            catch(e) { alert(e.message); }
        };

        window.handleGoogleLogin = async () => {
            try {
                const res = await signInWithPopup(auth, googleProvider);
                // Check if user doc exists, if not create as student
                const userDoc = await getDoc(doc(db, "users", res.user.uid));
                if (!userDoc.exists()) {
                    await setDoc(doc(db, "users", res.user.uid), { email: res.user.email, role: 'student' });
                }
            } catch(e) { 
                console.error(e);
                alert("Google Login Error: " + e.message); 
            }
        };

        window.doLogout = () => signOut(auth);

        // 2. Navigation & UI Logic
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                // Get Role
                const snap = await getDoc(doc(db, "users", user.uid));
                const role = snap.exists() ? snap.data().role : 'student';
                
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');

                if (role === 'admin') {
                    showView('view-admin');
                } else {
                    showView('view-student');
                    loadExams();
                }
            } else {
                currentUser = null;
                showView('view-auth');
                document.getElementById('bottom-nav').classList.add('hidden');
            }
        });

        function showView(viewId) {
            ['view-auth', 'view-admin', 'view-student', 'view-taking-exam'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(viewId).classList.remove('hidden');
        }

        window.navTo = (dest) => {
            // Simple nav logic for bottom bar
            if(dest === 'home') {
                 window.location.reload(); 
            }
            if(dest === 'profile') alert(`Profile:\n${currentUser.email}`);
        };

        // 3. Admin: Exam Creation
        let questionCount = 0;
        window.addQuestionField = () => {
            questionCount++;
            const container = document.getElementById('builder-questions');
            const div = document.createElement('div');
            div.className = 'question-block';
            div.innerHTML = `
                <h4>Question ${questionCount}</h4>
                <input type="text" class="q-txt" placeholder="Question Text">
                <input type="file" class="q-img" accept="image/*">
                <input type="text" class="opt1" placeholder="Option 1">
                <input type="text" class="opt2" placeholder="Option 2">
                <input type="text" class="opt3" placeholder="Option 3">
                <input type="text" class="opt4" placeholder="Option 4">
                <select class="q-correct">
                    <option value="0">Option 1 is Correct</option>
                    <option value="1">Option 2 is Correct</option>
                    <option value="2">Option 3 is Correct</option>
                    <option value="3">Option 4 is Correct</option>
                </select>
            `;
            container.appendChild(div);
        };

        window.saveExam = async () => {
            const btn = document.getElementById('btn-save-exam');
            const title = document.getElementById('new-exam-title').value;
            const time = document.getElementById('new-exam-time').value;
            const qBlocks = document.querySelectorAll('#builder-questions .question-block');

            if(!title || qBlocks.length === 0) return alert("Please fill exam details");

            btn.innerText = "Uploading Images...";
            btn.disabled = true;

            let questionsData = [];

            for(let block of qBlocks) {
                const text = block.querySelector('.q-txt').value;
                const fileIn = block.querySelector('.q-img');
                const correct = block.querySelector('.q-correct').value;
                const opts = [
                    block.querySelector('.opt1').value,
                    block.querySelector('.opt2').value,
                    block.querySelector('.opt3').value,
                    block.querySelector('.opt4').value
                ];

                let imgUrl = "";
                if(fileIn.files[0]) {
                    const fd = new FormData();
                    fd.append('file', fileIn.files[0]);
                    fd.append('upload_preset', CLOUD_PRESET);
                    try {
                        const res = await fetch(CLOUD_URL, { method: 'POST', body: fd });
                        const json = await res.json();
                        imgUrl = json.secure_url;
                    } catch(e) { 
                        console.error("Img Upload Error", e);
                        alert("Image upload failed. Check Cloudinary settings.");
                    }
                }

                questionsData.push({ text, options: opts, correct: parseInt(correct), image: imgUrl });
            }

            try {
                await addDoc(collection(db, "exams"), {
                    title, time: parseInt(time), questions: questionsData, createdAt: new Date()
                });
                alert("Exam Published Successfully!");
                window.location.reload();
            } catch(e) {
                alert("Database Error: " + e.message);
                btn.disabled = false;
            }
        };

        // 4. Student: Logic
        async function loadExams() {
            const list = document.getElementById('exam-list');
            const snap = await getDocs(collection(db, "exams"));
            list.innerHTML = "";
            
            if(snap.empty) {
                list.innerHTML = "<p>No exams available.</p>";
                return;
            }

            snap.forEach(d => {
                const ex = d.data();
                const card = document.createElement('div');
                card.className = "glass-card";
                card.innerHTML = `
                    <h3>${ex.title}</h3>
                    <p><i class="far fa-clock"></i> ${ex.time} mins | <i class="far fa-question-circle"></i> ${ex.questions.length} Questions</p>
                    <button onclick="window.startExam('${d.id}')">Start Exam</button>
                `;
                list.appendChild(card);
            });
            // Attach exam data globally for helper access
            window.allExams = snap.docs.map(d => ({id: d.id, ...d.data()}));
        }

        window.startExam = (id) => {
            currentExamData = window.allExams.find(e => e.id === id);
            showView('view-taking-exam');
            document.getElementById('active-exam-name').innerText = currentExamData.title;
            
            // Build UI
            const area = document.getElementById('quiz-area');
            area.innerHTML = "";
            currentExamData.questions.forEach((q, idx) => {
                let imgHTML = q.image ? `<img src="${q.image}" class="preview">` : '';
                let optsHTML = q.options.map((opt, i) => `
                    <div style="background:rgba(0,0,0,0.2); padding:10px; margin:5px 0; border-radius:5px;">
                        <input type="radio" name="q${idx}" value="${i}" id="q${idx}_${i}">
                        <label for="q${idx}_${i}" style="margin-left:10px; cursor:pointer; width:100%; display:inline-block;">${opt}</label>
                    </div>
                `).join('');

                area.innerHTML += `
                    <div class="question-block">
                        <p><strong>Q${idx+1}:</strong> ${q.text}</p>
                        ${imgHTML}
                        ${optsHTML}
                    </div>
                `;
            });

            // Timer
            let timeLeft = currentExamData.time * 60;
            const timerDisplay = document.getElementById('timer-display');
            timerInterval = setInterval(() => {
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                timerDisplay.innerText = `${m}:${s < 10 ? '0'+s : s}`;
                timeLeft--;
                if(timeLeft < 0) {
                    clearInterval(timerInterval);
                    alert("Time Up! Submitting automatically.");
                    window.submitExam();
                }
            }, 1000);
        };

        window.submitExam = async () => {
            clearInterval(timerInterval);
            let score = 0;
            currentExamData.questions.forEach((q, idx) => {
                const sel = document.querySelector(`input[name="q${idx}"]:checked`);
                if(sel && parseInt(sel.value) === q.correct) score++;
            });

            const percent = ((score / currentExamData.questions.length) * 100).toFixed(1);
            
            try {
                await addDoc(collection(db, "results"), {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    examTitle: currentExamData.title,
                    score,
                    total: currentExamData.questions.length,
                    date: new Date()
                });
                alert(`You scored ${score} out of ${currentExamData.questions.length} (${percent}%)`);
            } catch(e) {
                console.error(e);
                alert("Score saved locally, but db error: " + e.message);
            }
            window.location.reload();
        };

    </script>
</body>
</html>
