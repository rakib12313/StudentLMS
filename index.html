<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS Pro Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans pb-20">

    <!-- LOGIN SCREEN -->
    <div id="login-section" class="flex flex-col items-center justify-center h-screen px-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm text-center">
            <div class="text-6xl mb-4">🎓</div>
            <h1 class="text-3xl font-extrabold text-blue-600 mb-2">Smart LMS</h1>
            <button id="google-login-btn" class="bg-white border border-gray-300 text-gray-700 font-bold py-3 px-6 rounded-lg w-full flex items-center justify-center gap-3 hover:bg-gray-50 mt-6">
                <i class="fab fa-google text-red-500"></i> Sign in with Google
            </button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-section" class="hidden">
        <!-- Navbar -->
        <nav class="bg-blue-600 text-white p-4 shadow flex justify-between items-center sticky top-0 z-40">
            <div class="flex flex-col">
                <span class="font-bold tracking-wider text-lg">🎓 LMS</span>
                <span id="role-badge-nav" class="text-[10px] bg-blue-800 px-2 py-0.5 rounded w-fit mt-1 opacity-90">STUDENT</span>
            </div>
            <div onclick="openProfileModal()" class="flex items-center gap-2 cursor-pointer bg-blue-700 p-1 rounded-full pr-3">
                <img id="nav-photo" src="" class="w-8 h-8 rounded-full border-2 border-white">
                <span class="text-xs font-bold">Menu</span>
            </div>
        </nav>

        <div class="p-4">
            <!-- Approval Warning -->
            <div id="approval-warning" class="hidden bg-yellow-50 border-l-4 border-yellow-500 text-yellow-700 p-4 mb-4 rounded shadow-sm">
                <p class="font-bold">⚠️ Account Pending</p>
                <p class="text-sm">Wait for Admin approval to access content.</p>
            </div>

            <!-- MAIN CONTENT -->
            <div id="main-content" class="hidden">
                
                <!-- Admin Stats -->
                <div id="admin-stats" class="hidden grid-cols-2 gap-3 mb-4">
                    <div class="bg-white p-3 rounded shadow text-center">
                        <div class="text-2xl font-bold text-blue-600" id="stat-users">0</div>
                        <div class="text-xs text-gray-500">Students</div>
                    </div>
                    <div class="bg-white p-3 rounded shadow text-center">
                        <div class="text-2xl font-bold text-green-600" id="stat-exams">0</div>
                        <div class="text-xs text-gray-500">Exams</div>
                    </div>
                </div>

                <!-- Tabs -->
                <div class="flex mb-4 bg-white rounded-lg shadow-sm overflow-hidden text-sm font-medium">
                    <button onclick="switchTab('notes')" id="tab-notes" class="flex-1 py-3 active-tab">📚 Notes</button>
                    <button onclick="switchTab('exams')" id="tab-exams" class="flex-1 py-3 inactive-tab">📝 Exams</button>
                    <button onclick="switchTab('users')" id="tab-users" class="hidden flex-1 py-3 inactive-tab text-purple-600">👥 Users</button>
                </div>

                <!-- 1. NOTES TAB -->
                <div id="view-notes">
                    <!-- Cloudinary Upload UI (Admin Only) -->
                    <div id="admin-upload-ui" class="hidden bg-white p-4 rounded-lg shadow mb-4 border border-blue-100">
                        <h3 class="font-bold text-gray-800 mb-3 text-sm flex items-center gap-2">
                            <i class="fas fa-cloud-upload-alt text-orange-500"></i> Upload to Cloud
                        </h3>
                        <input type="text" id="note-title" placeholder="Note Title" class="w-full border p-2 rounded mb-2 text-sm bg-gray-50">
                        <input type="file" id="note-file" class="w-full text-sm mb-3 text-gray-500">
                        <button id="upload-btn" class="bg-orange-600 text-white px-4 py-2 rounded w-full font-bold text-sm">Upload File</button>
                        <p id="upload-status" class="text-xs mt-2 text-gray-500 text-center"></p>
                    </div>
                    <!-- Notes List -->
                    <div id="notes-list" class="space-y-3"></div>
                </div>

                <!-- 2. EXAMS TAB -->
                <div id="view-exams" class="hidden">
                    <!-- Admin Create Button -->
                    <div id="admin-exam-ui" class="hidden mb-4">
                        <button onclick="openExamCreator()" class="bg-indigo-600 text-white w-full py-3 rounded-lg shadow font-bold flex justify-center items-center gap-2">
                            <i class="fas fa-plus-circle"></i> Create New Exam
                        </button>
                    </div>
                    <!-- Student Score Summary -->
                    <div id="student-score-card" class="bg-white p-4 rounded-lg shadow mb-4 hidden">
                        <h3 class="font-bold text-gray-700 mb-2 text-sm">📊 My Results</h3>
                        <div id="my-results-list" class="space-y-2 text-sm"></div>
                    </div>
                    <div id="exams-list" class="space-y-3"></div>
                </div>

                <!-- 3. USERS TAB (Admin) -->
                <div id="view-users" class="hidden">
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <div id="users-list" class="divide-y divide-gray-100"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- MODALS -->
    
    <!-- Profile Modal -->
    <div id="profile-modal" class="hidden fixed inset-0 z-50 bg-black bg-opacity-60 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-xl p-6 relative">
            <button onclick="document.getElementById('profile-modal').classList.add('hidden')" class="absolute top-3 right-4 text-2xl text-gray-400">&times;</button>
            <div class="text-center">
                <img id="profile-photo" src="" class="w-20 h-20 rounded-full mx-auto mb-3 border-4 border-blue-50">
                <h2 id="profile-name" class="text-xl font-bold">User</h2>
                <p id="profile-email" class="text-gray-500 text-sm mb-4">...</p>
                <button id="logout-btn" class="bg-red-50 text-red-600 border border-red-200 w-full py-2 rounded font-bold">Log Out</button>
            </div>
        </div>
    </div>

    <!-- Exam Creator -->
    <div id="exam-creator-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-end sm:items-center justify-center z-50">
        <div class="bg-white w-full h-[95vh] sm:h-auto sm:max-w-lg rounded-t-xl sm:rounded-xl p-4 flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">Create Exam</h2>
                <button onclick="closeExamCreator()" class="text-2xl text-gray-500">&times;</button>
            </div>
            <div class="overflow-y-auto flex-grow mb-4 px-1">
                <input id="new-exam-title" type="text" placeholder="Title" class="w-full border p-2 rounded mb-2 bg-gray-50">
                <input id="new-exam-duration" type="number" placeholder="Minutes" class="w-full border p-2 rounded mb-4 bg-gray-50">
                <div id="questions-container" class="space-y-4"></div>
                <button onclick="addQuestionField()" class="w-full mt-4 border-2 border-dashed border-blue-300 text-blue-500 p-2 rounded font-bold">+ Add Question</button>
            </div>
            <button onclick="publishExam()" class="bg-indigo-600 text-white py-3 rounded-lg font-bold w-full">Publish</button>
        </div>
    </div>

    <!-- Exam Taker -->
    <div id="exam-taker-modal" class="hidden fixed inset-0 bg-white z-[60] flex flex-col">
        <div class="bg-gray-900 text-white p-4 shadow flex justify-between items-center">
            <h2 id="taking-exam-title" class="font-bold truncate w-40">Exam</h2>
            <div id="timer-display" class="bg-red-600 px-3 py-1 rounded font-mono font-bold">00:00</div>
        </div>
        <div id="exam-questions-area" class="flex-grow overflow-y-auto p-4 bg-gray-50 pb-20"></div>
        <div class="p-4 bg-white border-t fixed bottom-0 w-full">
            <button onclick="submitExam()" class="bg-green-600 text-white w-full py-3 rounded-lg font-bold">Submit</button>
        </div>
    </div>

    <!-- Viewer -->
    <div id="viewer-modal" class="hidden fixed inset-0 z-[70] bg-black bg-opacity-95 flex flex-col justify-center items-center">
        <button onclick="closeViewer()" class="absolute top-4 right-4 text-white text-4xl font-bold z-[80]">&times;</button>
        <div id="watermark-overlay" class="absolute inset-0 flex flex-wrap opacity-10 z-[75] overflow-hidden pointer-events-none"></div>
        <div class="relative w-full h-full sm:w-11/12 sm:h-5/6 bg-white flex justify-center items-center">
            <iframe id="pdf-frame" class="w-full h-full hidden"></iframe>
            <img id="image-frame" class="max-w-full max-h-full hidden object-contain">
            <div class="absolute inset-0 z-[78]" oncontextmenu="return false;"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
