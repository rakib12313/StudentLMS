<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-50 select-none">
    <div class="animated-bg"></div>

    <!-- Login -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-6">
        <div class="glass-card w-full max-w-sm p-8 text-center animate-enter">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-500/40 mb-6">
                <i class="fas fa-graduation-cap text-3xl text-white"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 mb-2">Welcome</h1>
            <p class="text-sm text-slate-500 mb-8">Access your learning dashboard</p>
            
            <button id="google-btn" class="w-full bg-white border border-slate-200 py-3.5 rounded-xl font-bold text-sm text-slate-700 flex items-center justify-center gap-3 shadow-sm hover:bg-slate-50 transition active:scale-95">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5"> 
                Continue with Google
            </button>
            <p class="mt-4 text-[10px] text-slate-400">By continuing, you agree to our Terms.</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard-section" class="hidden min-h-screen">
        
        <!-- Header -->
        <div class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-100 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img id="nav-photo" class="w-9 h-9 rounded-full border border-slate-200 bg-white object-cover">
                <div>
                    <h3 id="nav-name" class="text-sm font-bold text-slate-800 leading-tight">Student</h3>
                    <span id="nav-batch" class="text-[10px] text-indigo-600 font-bold bg-indigo-50 px-2 py-0.5 rounded-full">...</span>
                </div>
            </div>
            <div class="flex gap-2">
                 <button onclick="toggleTheme()" class="w-9 h-9 rounded-full bg-slate-100 flex items-center justify-center text-slate-600"><i class="fas fa-moon"></i></button>
                 <button id="logout-btn" class="w-9 h-9 rounded-full bg-red-50 flex items-center justify-center text-red-500"><i class="fas fa-power-off"></i></button>
            </div>
        </div>

        <div class="max-w-2xl mx-auto px-4 pt-4 pb-24">
            
            <!-- Live Banner -->
            <div id="live-banner" class="hidden mb-6 bg-red-500 rounded-2xl p-4 text-white shadow-lg shadow-red-500/30 flex justify-between items-center animate-pulse cursor-pointer">
                <div class="flex items-center gap-3">
                    <span class="w-2.5 h-2.5 bg-white rounded-full animate-ping"></span>
                    <p class="font-bold text-sm">Live Class is Active!</p>
                </div>
                <a id="live-btn" href="#" target="_blank" class="bg-white text-red-600 px-4 py-1.5 rounded-lg text-xs font-bold">JOIN</a>
            </div>

            <!-- Notice -->
            <div id="notice-box" class="hidden mb-6 bg-indigo-600 rounded-2xl p-5 text-white shadow-xl shadow-indigo-600/20 relative overflow-hidden">
                <i class="fas fa-bullhorn absolute -right-2 -bottom-4 text-8xl text-white/10 rotate-[-20deg]"></i>
                <p class="text-xs font-bold opacity-80 mb-1">ANNOUNCEMENT</p>
                <p id="notice-text" class="text-sm font-medium leading-relaxed relative z-10">...</p>
            </div>

            <!-- Tab Content -->
            <div id="view-home" class="space-y-4 animate-enter">
                <div class="relative">
                    <i class="fas fa-search absolute left-4 top-3.5 text-slate-400"></i>
                    <input id="search-bar" onkeyup="filterNotes()" placeholder="Find notes..." class="pl-10">
                </div>
                <div class="tab-scroll mb-2">
                    <button class="tab-btn active-tab">All</button>
                    <button class="tab-btn inactive-tab">Physics</button>
                    <button class="tab-btn inactive-tab">Math</button>
                </div>
                <div id="notes-grid" class="grid gap-3"></div>
            </div>

            <div id="view-exams" class="hidden space-y-4 animate-enter">
                 <h2 class="font-bold text-lg text-slate-700">Available Exams</h2>
                 <div id="exams-grid" class="grid gap-3"></div>
            </div>

            <div id="view-profile" class="hidden animate-enter">
                <div class="glass-card p-6 text-center">
                    <img id="profile-lg" class="w-24 h-24 mx-auto rounded-full mb-4 border-4 border-slate-50 shadow-sm">
                    <h2 id="p-name" class="text-xl font-bold">User</h2>
                    <p id="p-email" class="text-sm text-slate-500 mb-6">user@gmail.com</p>
                    <div class="grid grid-cols-3 gap-3 mb-6">
                        <div class="bg-indigo-50 p-3 rounded-2xl"><p id="xp-stat" class="text-xl font-bold text-indigo-600">0</p><p class="text-[10px] text-slate-400">XP</p></div>
                        <div class="bg-green-50 p-3 rounded-2xl"><p id="streak-stat" class="text-xl font-bold text-green-600">0</p><p class="text-[10px] text-slate-400">Days</p></div>
                        <div class="bg-orange-50 p-3 rounded-2xl"><p class="text-xl font-bold text-orange-600">1</p><p class="text-[10px] text-slate-400">Level</p></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Mobile Bottom Nav -->
        <div class="bottom-nav">
            <button onclick="setTab('home')" id="btn-home" class="nav-btn active flex flex-col items-center gap-1">
                <i class="fas fa-book text-xl"></i>
                <span class="text-[10px] font-bold">Learn</span>
            </button>
            <button onclick="setTab('exams')" id="btn-exams" class="nav-btn flex flex-col items-center gap-1">
                <i class="fas fa-clipboard-check text-xl"></i>
                <span class="text-[10px] font-bold">Exams</span>
            </button>
            <button onclick="setTab('profile')" id="btn-profile" class="nav-btn flex flex-col items-center gap-1">
                <i class="fas fa-user text-xl"></i>
                <span class="text-[10px] font-bold">Profile</span>
            </button>
        </div>
    </div>

    <!-- Viewer Modal -->
    <div id="viewer-modal" class="hidden fixed inset-0 z-[100] bg-black flex flex-col">
        <button onclick="document.getElementById('viewer-modal').classList.add('hidden')" class="absolute top-4 right-4 text-white text-3xl z-50 bg-black/50 w-10 h-10 rounded-full">&times;</button>
        <iframe id="pdf-frame" class="w-full h-full border-none"></iframe>
    </div>

    <!-- Exam Modal -->
    <div id="exam-runner" class="hidden fixed inset-0 z-[100] bg-white flex flex-col">
        <div class="p-4 bg-slate-900 text-white flex justify-between items-center shadow-md">
            <span class="font-bold text-sm">Exam In Progress</span>
            <span id="timer" class="bg-red-600 px-3 py-1 rounded text-xs font-mono font-bold">00:00</span>
        </div>
        <div class="flex-grow flex flex-col lg:flex-row h-full overflow-hidden">
            <iframe id="exam-pdf" class="w-full lg:w-1/2 h-1/2 lg:h-full bg-slate-100"></iframe>
            <div class="w-full lg:w-1/2 h-full flex flex-col bg-white">
                <div id="exam-qs" class="flex-grow overflow-y-auto p-4 space-y-4"></div>
                <div class="p-4 border-t">
                    <button onclick="finishExam()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold shadow-lg">Submit Exam</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
    <script>
        window.setTab = (t) => {
            ['home','exams','profile'].forEach(x => {
                document.getElementById('view-'+x).classList.add('hidden');
                document.getElementById('btn-'+x).classList.remove('active');
            });
            document.getElementById('view-'+t).classList.remove('hidden');
            document.getElementById('btn-'+t).classList.add('active');
        };
        window.toggleTheme = () => document.body.classList.toggle('dark');
    </script>
</body>
</html>
