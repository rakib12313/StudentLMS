<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonLMS - Student</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #000; --bg-glass: rgba(28,28,30,0.85); --primary: #0A84FF; --danger: #FF453A; --success: #30D158; --text: #FFF;
        }
        body { margin:0; font-family:'Inter',sans-serif; background:radial-gradient(circle at 50% 100%, #1c1c1e, #000); color:var(--text); min-height:100vh; padding-bottom:100px; }
        .container { max-width:800px; margin:0 auto; padding:20px; }
        .hidden { display:none!important; }
        .card { background:var(--bg-glass); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.1); border-radius:18px; padding:20px; margin-bottom:15px; }
        input, select { width:100%; background:rgba(0,0,0,0.5); border:1px solid rgba(255,255,255,0.1); padding:12px; border-radius:10px; color:white; margin-bottom:10px; }
        button { width:100%; padding:12px; border-radius:10px; border:none; cursor:pointer; font-weight:bold; }
        .btn-primary { background:var(--primary); color:white; }
        .btn-sec { background:rgba(255,255,255,0.1); color:white; }
        .dock { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(40,40,40,0.8); backdrop-filter:blur(20px); padding:15px; border-radius:24px; display:flex; gap:30px; box-shadow:0 10px 40px rgba(0,0,0,0.5); z-index:1000; border:1px solid rgba(255,255,255,0.1); }
        .dock i { font-size:24px; color:rgba(255,255,255,0.5); cursor:pointer; transition:0.3s; }
        .dock i.active { color:var(--primary); transform:translateY(-5px); }
        #loader { position:fixed; inset:0; background:#000; z-index:9999; display:flex; align-items:center; justify-content:center; }
        
        /* Exam Styles */
        .opt-label { display:block; padding:15px; background:rgba(255,255,255,0.05); border-radius:10px; margin-bottom:5px; cursor:pointer; border:1px solid transparent; }
        .opt-label:hover { border-color:var(--primary); }
        input[type="radio"]:checked + span { color:var(--primary); font-weight:bold; }
        #cam-view { width:150px; height:100px; background:black; position:fixed; top:10px; right:10px; border-radius:10px; border:2px solid red; z-index:2000; }
    </style>
</head>
<body>
    <div id="loader">Loading System...</div>

    <!-- AUTH SCREEN -->
    <div id="auth-view" class="container hidden">
        <div class="card" style="text-align:center;">
            <h1>LMS Portal</h1>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn-primary" onclick="app.login()">Login</button>
            <p style="margin-top:10px; cursor:pointer; color:#888;" onclick="app.forgotPass()">Forgot Password?</p>
            <p style="margin-top:10px; cursor:pointer; color:var(--primary);" onclick="app.showReg()">New Account</p>
        </div>
        <div id="reg-box" class="card hidden">
            <h3>Register</h3>
            <input type="text" id="r-name" placeholder="Name">
            <select id="r-class"><option>Loading...</option></select>
            <input type="email" id="r-email" placeholder="Email">
            <input type="password" id="r-pass" placeholder="Password">
            <button class="btn-primary" onclick="app.register()">Sign Up</button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-view" class="container hidden">
        <!-- HOME -->
        <div id="tab-home">
            <div class="card">
                <h2>Hi, <span id="u-name">User</span>!</h2>
                <small>Class <span id="u-class">--</span></small>
            </div>
            <div class="card">
                <h3>📢 Announcements</h3>
                <div id="ann-list"></div>
            </div>
        </div>

        <!-- EXAMS -->
        <div id="tab-exams" class="hidden">
            <h3>Available Exams</h3>
            <div id="exam-list"></div>
        </div>

        <!-- PROFILE -->
        <div id="tab-profile" class="hidden">
            <div class="card">
                <h3><i class="fas fa-chart-pie"></i> Performance</h3>
                <div id="sub-analytics">Loading...</div>
            </div>
            <div class="card">
                <h3>Account</h3>
                <p>Status: <span id="p-status" class="badge" style="background:green">Active</span></p>
                <button class="btn-sec" onclick="app.buyPremium()"><i class="fas fa-crown"></i> Upgrade to Premium</button>
                <button class="btn-danger" style="margin-top:10px;" onclick="app.logout()">Logout</button>
            </div>
        </div>
        
        <!-- DOCK -->
        <div class="dock">
            <i class="fas fa-home active" onclick="app.nav('home', this)"></i>
            <i class="fas fa-file-alt" onclick="app.nav('exams', this)"></i>
            <i class="fas fa-user" onclick="app.nav('profile', this)"></i>
        </div>
    </div>

    <!-- EXAM ENGINE -->
    <div id="exam-engine" class="hidden" style="position:fixed; inset:0; background:#000; z-index:1500; overflow-y:auto;">
        <video id="cam-view" autoplay muted playsinline></video>
        <div style="padding:20px; max-width:800px; margin:0 auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                <h3 id="ex-title-disp">Exam</h3>
                <h3 id="ex-timer" style="color:var(--danger)">00:00</h3>
            </div>
            <div id="q-area"></div>
            <button class="btn-primary" style="margin-top:20px;" onclick="app.submitExam()">SUBMIT</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // CREDENTIALS
        const firebaseConfig = { apiKey: "AIzaSyBEMPS8vEJztGpoBPJjJIzKKInyt4IY9rQ", authDomain: "studentlms-79722.firebaseapp.com", projectId: "studentlms-79722", storageBucket: "studentlms-79722.firebasestorage.app", messagingSenderId: "1029623857004", appId: "1:1029623857004:web:fa07cb3de1270990a87d49" };
        const appInit = initializeApp(firebaseConfig);
        const auth = getAuth(appInit);
        const db = getFirestore(appInit);
        
        let user, activeExam, timer;

        window.app = {
            nav: (t, el) => {
                document.querySelectorAll('.dock i').forEach(x=>x.classList.remove('active')); el.classList.add('active');
                ['home','exams','profile'].forEach(x=>document.getElementById(`tab-${x}`).classList.add('hidden'));
                document.getElementById(`tab-${t}`).classList.remove('hidden');
                if(t==='exams') app.loadExams();
                if(t==='profile') app.loadAnalytics();
            },
            showReg: async () => {
                document.getElementById('reg-box').classList.remove('hidden');
                // Load Dynamic Classes
                const s = await getDocs(collection(db,"classes"));
                const sel = document.getElementById('r-class'); sel.innerHTML="";
                s.forEach(d=>sel.innerHTML+=`<option value="${d.data().name}">${d.data().name}</option>`);
            },
            login: async () => {
                try { 
                    const r = await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value);
                } catch(e) { alert(e.message); }
            },
            register: async () => {
                try {
                    const r = await createUserWithEmailAndPassword(auth, document.getElementById('r-email').value, document.getElementById('r-pass').value);
                    await setDoc(doc(db,"users",r.user.uid), {
                        email: r.user.email,
                        displayName: document.getElementById('r-name').value,
                        class: document.getElementById('r-class').value,
                        role: 'student', isPremium: false, photoURL: ""
                    });
                    location.reload();
                } catch(e) { alert(e.message); }
            },
            forgotPass: async () => {
                const e = prompt("Enter Email:");
                if(e) { await sendPasswordResetEmail(auth,e); alert("Reset link sent!"); }
            },
            logout: () => signOut(auth).then(()=>location.reload()),

            // FEATURES
            buyPremium: async () => {
                if(confirm("Simulate Payment of $10 for Premium?")) {
                    await updateDoc(doc(db,"users",user.uid),{isPremium:true});
                    alert("Upgrade Successful! You can now access Premium Exams.");
                    location.reload();
                }
            },
            loadExams: async () => {
                // Filter by Class
                const q = query(collection(db,"exams"), where("class","==",user.class));
                const s = await getDocs(q);
                const c = document.getElementById('exam-list'); c.innerHTML="";
                s.forEach(d=>{
                    const e=d.data();
                    if(!e.published) return;
                    let btn = `<button class="btn-primary" onclick="app.startExam('${d.id}')">Start</button>`;
                    if(e.isPremium && !user.isPremium) btn = `<button class="btn-sec" onclick="app.buyPremium()"><i class="fas fa-lock"></i> Buy Premium</button>`;
                    
                    c.innerHTML += `<div class="card">
                        <div style="display:flex;justify-content:space-between;">
                            <div><b>${e.title}</b><br><small>${e.subject}</small></div>
                            ${e.isPremium ? '<span style="color:gold"><i class="fas fa-crown"></i></span>' : ''}
                        </div>
                        <p>${e.time} Mins | ${e.questions.length} Qs</p>
                        ${btn}
                    </div>`;
                });
            },
            
            // WEBCAM & EXAM
            startExam: async (id) => {
                // Permission
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({video:true});
                    document.getElementById('cam-view').srcObject = stream;
                } catch(e) {
                    alert("Webcam required for Proctoring!"); return;
                }

                const snap = await getDoc(doc(db,"exams",id));
                activeExam = {id:snap.id, ...snap.data()};
                
                document.getElementById('app-view').classList.add('hidden');
                document.getElementById('exam-engine').classList.remove('hidden');
                document.getElementById('ex-title-disp').innerText = activeExam.title;

                const c = document.getElementById('q-area'); c.innerHTML="";
                activeExam.questions.forEach((q,i)=>{
                    c.innerHTML += `<div class="card"><p><b>Q${i+1}.</b> ${q.text}</p>
                    ${q.options.map((o,x)=>`<label class="opt-label"><input type="radio" name="q${i}" value="${x}"> <span>${o}</span></label>`).join('')}
                    </div>`;
                });

                let t = activeExam.time * 60;
                timer = setInterval(()=>{
                    let m=Math.floor(t/60),s=t%60;
                    document.getElementById('ex-timer').innerText = `${m}:${s}`;
                    if(t-- <= 0) app.submitExam();
                },1000);
            },
            submitExam: async () => {
                // Snapshot Mock (Real app would upload canvas image)
                console.log("Proctoring Snapshot Taken");
                
                clearInterval(timer);
                let score=0;
                activeExam.questions.forEach((q,i)=>{
                    const s = document.querySelector(`input[name="q${i}"]:checked`);
                    if(s && parseInt(s.value)===q.correct) score++;
                    else if(s) score -= activeExam.negMark||0;
                });
                
                await addDoc(collection(db,"results"), {
                    uid: user.uid, studentName: user.displayName,
                    examId: activeExam.id, examTitle: activeExam.title,
                    score: score, total: activeExam.questions.length,
                    date: new Date(), subject: activeExam.subject
                });
                
                // Stop Camera
                const stream = document.getElementById('cam-view').srcObject;
                stream.getTracks().forEach(t=>t.stop());
                
                alert("Submitted! Score: "+score);
                location.reload();
            },
            
            // ANALYTICS
            loadAnalytics: async () => {
                const s = await getDocs(query(collection(db,"results"), where("uid","==",user.uid)));
                let subs = {};
                s.forEach(d=>{
                    const r=d.data();
                    if(!subs[r.subject]) subs[r.subject] = {score:0, total:0};
                    subs[r.subject].score += r.score;
                    subs[r.subject].total += r.total;
                });
                
                let h="";
                for(let sub in subs) {
                    const pct = (subs[sub].score / subs[sub].total) * 100;
                    h += `<div style="margin-bottom:10px;">
                        <div style="display:flex;justify-content:space-between;"><small>${sub}</small><small>${pct.toFixed(1)}%</small></div>
                        <div style="height:6px; background:#333; border-radius:3px; overflow:hidden;"><div style="width:${pct}%; height:100%; background:var(--primary)"></div></div>
                    </div>`;
                }
                document.getElementById('sub-analytics').innerHTML = h || "No data.";
                document.getElementById('u-class').innerText = user.class;
                document.getElementById('u-name').innerText = user.displayName;
            },
            
            loadAnn: async () => {
                const s = await getDocs(collection(db,"announcements"));
                const c = document.getElementById('ann-list');
                s.forEach(d=>c.innerHTML+=`<div style="padding:10px; background:rgba(255,255,255,0.05); margin-bottom:5px; border-radius:8px;">${d.data().text}</div>`);
            }
        };

        onAuthStateChanged(auth, async (u) => {
            document.getElementById('loader').style.display='none';
            if(u) {
                const d = await getDoc(doc(db,"users",u.uid));
                user = {uid:u.uid, ...d.data()};
                document.getElementById('auth-view').classList.add('hidden');
                
                if(user.role === 'admin' || user.role === 'teacher') {
                    window.location.href = 'admin.html';
                } else {
                    document.getElementById('app-view').classList.remove('hidden');
                    app.nav('home', document.querySelector('.dock i'));
                }
            } else {
                document.getElementById('auth-view').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
